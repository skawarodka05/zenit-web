<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ZENIT · Главная</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: #0A0A1A; color: #fff; min-height: 100vh; padding-bottom: 40px; }

/* Шапка */
.header {
  display: flex; align-items: center; gap: 12px;
  padding: 16px; background: #14142B;
  border-bottom: 1px solid rgba(0, 255, 255, 0.3);
  position: sticky; top: 0; z-index: 100;
}
.logo-wrap { display: flex; align-items: center; gap: 12px; cursor: pointer; flex: 1; text-decoration: none; color: inherit; }
.logo-img { width: 44px; height: 44px; object-fit: contain; }
.logo-text h1 { font-size: 22px; font-weight: 900; letter-spacing: 1px; }
.logo-text p { font-size: 13px; color: #00FFFF; }

.header-btn {
  width: 44px; height: 44px; border-radius: 12px;
  background: #0A0A1A; border: 1px solid rgba(0, 255, 255, 0.5);
  color: #00FFFF; font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  text-decoration: none; transition: all 0.2s;
}
.header-btn:hover { background: rgba(0, 255, 255, 0.15); }
.header-btn.pink { border-color: rgba(255, 0, 255, 0.5); color: #FF00FF; }
.header-btn.pink:hover { background: rgba(255, 0, 255, 0.15); }

/* Контейнер */
.container { max-width: 900px; margin: 0 auto; padding: 16px; }

/* Имя пользователя */
.user-card {
  background: #14142B; border: 1px solid rgba(255, 0, 255, 0.5);
  border-radius: 12px; padding: 14px 16px; margin-bottom: 20px;
  display: flex; justify-content: space-between; align-items: center;
  cursor: pointer; transition: all 0.2s; text-decoration: none; color: #fff;
}
.user-card:hover { background: rgba(255, 0, 255, 0.05); }
.user-name { font-size: 16px; font-weight: 700; }
.user-profile-link { font-size: 13px; color: #00FFFF; }

/* Поиск */
.search-bar { margin-bottom: 24px; }
.search-input {
  width: 100%; padding: 14px 18px; border-radius: 12px;
  background: #14142B; border: 1px solid rgba(0, 255, 255, 0.5);
  color: #fff; font-size: 15px; outline: none; transition: all 0.2s;
}
.search-input:focus { border-color: #00FFFF; box-shadow: 0 0 12px rgba(0, 255, 255, 0.3); }
.search-input::placeholder { color: #606060; }

/* Сетка карточек */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 14px;
}

.db-card {
  background: #14142B; border: 1px solid rgba(0, 255, 255, 0.5);
  border-radius: 14px; overflow: hidden; cursor: pointer;
  display: flex; flex-direction: column; text-decoration: none; color: #fff;
  transition: all 0.2s;
}
.db-card:hover { border-color: #00FFFF; box-shadow: 0 0 15px rgba(0, 255, 255, 0.2); transform: translateY(-2px); }

.db-image {
  width: 100%; height: 140px;
  border-bottom: 1px solid rgba(0, 255, 255, 0.3);
  position: relative; overflow: hidden;
  background: #0A0A1A;
}

.db-image img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}

.db-image-placeholder {
  width: 100%; height: 100%; position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 48px; 
  background: linear-gradient(135deg, rgba(255,0,255,0.4), rgba(0,255,255,0.4));
}

.db-title {
  padding: 12px; font-size: 14px; font-weight: 700; text-align: center;
  background: #14142B; display: flex; align-items: center; justify-content: center;
  min-height: 50px;
}

.empty { text-align: center; padding: 60px 20px; color: #606060; grid-column: 1 / -1; }
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="logo-wrap">
    <img src="logo_zenit.png" alt="ZENIT" class="logo-img" onerror="this.style.display='none'">
    <div class="logo-text">
      <h1>ZENIT</h1>
      <p id="header-role">Загрузка...</p>
    </div>
  </a>
  <a href="tasks.html" class="header-btn" title="Мой Чек-лист">✅</a>
  <button class="header-btn pink" onclick="logout()" title="Выйти">🚪</button>
</div>

<div class="container">
  <a href="profile.html" class="user-card">
    <div class="user-name" id="user-name">Загрузка...</div>
    <div class="user-profile-link">Профиль →</div>
  </a>

  <div class="search-bar">
    <input type="text" class="search-input" id="search-input" placeholder="🔍 Поиск раздела..." oninput="filterItems()">
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
const SB_URL = 'https://owkizfikhtiqbwftqgfd.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93a2l6ZmlraHRpcWJ3ZnRxZ2ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0OTYxMDYsImV4cCI6MjEwNzA3MjEwNn0.EHVyXiBYuSJrDVd_k5zAbwqT3ZPFF43p5Uh4_huKoOo';
window.SB = window.supabase.createClient(SB_URL, SB_KEY);

const ROLE_TITLES = {
  MANAGER: 'Менеджер', DEPUTY_DIRECTOR: 'Заместитель директора', DIRECTOR: 'Директор',
  TU: 'ТУ', OD: 'ОД', ID: 'ИД', MODERATOR_ZENIT: 'Модератор Zenit', LEAD_DEV_ZENIT: 'Ведущий разработчик Zenit'
};

let currentUser = JSON.parse(localStorage.getItem('zenit-user') || 'null');
if (!currentUser) { location.href = 'index.html'; }

const DB_ITEMS = [
  // Прямая ссылка на raw-файл с GitHub. Обходит кэш и блокировки.
  { name: 'Мой Чек-лист', image: 'https://raw.githubusercontent.com/skawarodka05/zenit-web/main/banner_tasks.jpg', link: 'tasks.html', emoji: '✅' },
  { name: 'База Документов', image: 'banner_docs.jpg', link: 'chat.html?db=База Документов', emoji: '📄' },
  { name: 'База Продуктов', image: 'banner_products.jpg', link: 'chat.html?db=База Продуктов', emoji: '🛒' },
  { name: 'База Оборудования', image: 'banner_equipment.jpg', link: 'chat.html?db=База Оборудования', emoji: '⚙️' },
  { name: 'База Человечков', image: 'banner_people.jpg', link: 'chat.html?db=База Человечков', emoji: '👥' },
  { name: 'База Контактов', image: 'banner_contacts.jpg', link: 'contacts.html', emoji: '📞' },
  { name: 'База АУП', image: 'banner_aup.jpg', link: 'chat.html?db=База АУП', emoji: '🏢' },
  { name: 'База Алхимии', image: 'banner_alchemy.jpg', link: 'chat.html?db=База Алхимии', emoji: '🧪' },
  { name: 'Почта дня', image: 'banner_mail.jpg', link: 'chat.html?db=Почта дня', emoji: '📧' },
  { name: 'База SAI Global', image: 'banner_sai.jpg', link: 'sai.html', emoji: '📊' },
  { name: 'Общение', image: 'banner_communication.jpg', link: 'messenger.html', emoji: '💬' },
  { name: 'Псевдо диск L', image: 'banner_disk_l.jpg', link: 'disk_l.html', emoji: '💾' },
  { name: 'База слэнга', image: 'banner_slang.jpg', link: 'slang.html', emoji: '📚' }
];

let filteredItems = [...DB_ITEMS];

function init() {
  document.getElementById('user-name').textContent = currentUser.name || 'Гость';
  document.getElementById('header-role').textContent = ROLE_TITLES[currentUser.role] || currentUser.role || '';
  renderGrid();
}

// Отрисовка через тег <img> с защитой от ошибок (onerror)
function renderGrid() {
  const grid = document.getElementById('grid');

  if (filteredItems.length === 0) {
    grid.innerHTML = '<div class="empty">Ничего не найдено</div>';
    return;
  }

  grid.innerHTML = filteredItems.map(item => {
    const imgHtml = item.image 
      ? `<div class="db-image">
           <img src="${item.image}" alt="${item.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
           <div class="db-image-placeholder" style="display:none;">${item.emoji}</div>
         </div>`
      : `<div class="db-image"><div class="db-image-placeholder">${item.emoji}</div></div>`;

    return `
      <a href="${item.link}" class="db-card">
        ${imgHtml}
        <div class="db-title">${item.name}</div>
      </a>
    `;
  }).join('');
}

function filterItems() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  filteredItems = q ? DB_ITEMS.filter(item => item.name.toLowerCase().includes(q)) : [...DB_ITEMS];
  renderGrid();
}

function logout() {
  if (!confirm('Выйти из аккаунта?')) return;
  localStorage.removeItem('zenit-user');
  location.href = 'index.html';
}

init();
</script>
</body>
</html>
