<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ZENIT · Псевдо диск L</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: #0A0A1A; color: #fff; min-height: 100vh; }
.hidden { display: none !important; }

/* Шапка */
.header {
  display: flex; align-items: center; gap: 12px;
  padding: 16px; background: #14142B;
  border-bottom: 1px solid rgba(0, 255, 255, 0.3);
  position: sticky; top: 0; z-index: 100;
}
.back-btn {
  width: 42px; height: 42px; border-radius: 12px;
  background: #0A0A1A; border: 1px solid rgba(0, 255, 255, 0.5);
  color: #00FFFF; font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.header-title { flex: 1; }
.header-title h1 { font-size: 18px; font-weight: 700; }
.header-title p { font-size: 12px; color: #00FFFF; margin-top: 2px; }

/* Контейнер */
.container { max-width: 900px; margin: 0 auto; padding: 16px 16px 100px; }

/* Поиск */
.search-bar { margin-bottom: 16px; }
.search-input {
  width: 100%; padding: 14px 18px; border-radius: 12px;
  background: #14142B; border: 1px solid rgba(0, 255, 255, 0.4);
  color: #fff; font-size: 14px; outline: none;
}
.search-input:focus { border-color: #00FFFF; box-shadow: 0 0 12px rgba(0, 255, 255, 0.3); }

/* Список */
.disk-list { display: flex; flex-direction: column; gap: 12px; }

/* Карточка файла */
.disk-card {
  display: flex; align-items: center; gap: 14px;
  background: #14142B; border: 1px solid rgba(0, 255, 255, 0.4);
  border-radius: 14px; padding: 16px;
  transition: all 0.2s;
}
.disk-card:hover { border-color: #00FFFF; box-shadow: 0 0 15px rgba(0, 255, 255, 0.2); }

.disk-icon {
  width: 54px; height: 54px; border-radius: 50%;
  background: rgba(0, 255, 255, 0.15); color: #00FFFF;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; flex-shrink: 0;
}

.disk-info { flex: 1; min-width: 0; }
.disk-name {
  font-size: 15px; font-weight: 700; margin-bottom: 4px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.disk-meta { font-size: 12px; color: #B0B0C0; }
.disk-size { color: #FF00FF; font-weight: 700; }
.disk-author { color: #00FFFF; }

.disk-actions {
  display: flex; gap: 6px; align-items: center; flex-shrink: 0;
}
.action-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: transparent; border: 1px solid rgba(0, 255, 255, 0.4);
  color: #00FFFF; cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.action-btn:hover { background: rgba(0, 255, 255, 0.15); }
.action-btn.pink { border-color: rgba(255, 0, 255, 0.5); color: #FF00FF; }
.action-btn.pink:hover { background: rgba(255, 0, 255, 0.15); }

/* FAB */
.fab {
  position: fixed; bottom: 24px; right: 24px;
  padding: 16px 24px; border: none; border-radius: 50px;
  background: linear-gradient(90deg, #FF00FF, #00FFFF);
  color: #fff; font-size: 15px; font-weight: 700;
  cursor: pointer; box-shadow: 0 0 25px rgba(0, 255, 255, 0.5);
  display: flex; align-items: center; gap: 8px;
}
.fab:hover { transform: translateY(-3px); box-shadow: 0 0 35px rgba(0, 255, 255, 0.7); }

/* Модалка */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8);
  display: none; align-items: center; justify-content: center;
  z-index: 500; padding: 20px;
}
.modal-bg.show { display: flex; }
.modal {
  background: #14142B; border: 1px solid rgba(0, 255, 255, 0.4);
  border-radius: 16px; padding: 24px; max-width: 500px; width: 100%;
  max-height: 90vh; overflow-y: auto;
}
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }

.form-group { margin-bottom: 14px; }
.form-label { display: block; font-size: 12px; color: #B0B0C0; margin-bottom: 6px; font-weight: 600; }
.form-input {
  width: 100%; padding: 12px 14px; border-radius: 10px;
  background: #0A0A1A; border: 1px solid rgba(0, 255, 255, 0.4);
  color: #fff; font-size: 14px; outline: none; font-family: inherit;
}
.form-input:focus { border-color: #00FFFF; }

/* Файл-выбор */
.file-picker {
  display: flex; align-items: center; gap: 10px;
  padding: 14px; border-radius: 10px;
  background: #0A0A1A; border: 1px dashed rgba(0, 255, 255, 0.4);
  cursor: pointer; transition: all 0.2s;
}
.file-picker:hover { border-color: #00FFFF; background: rgba(0, 255, 255, 0.05); }
.file-picker.active { border-color: #FF00FF; background: rgba(255, 0, 255, 0.1); }
.file-icon { font-size: 24px; }
.file-text { flex: 1; font-size: 13px; color: #B0B0C0; }
.file-picker.active .file-text { color: #FF00FF; font-weight: 700; }

.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.modal-btn {
  flex: 1; padding: 14px; border-radius: 12px;
  font-size: 15px; font-weight: 700; cursor: pointer; border: none;
}
.modal-btn.save { background: linear-gradient(90deg, #FF00FF, #00FFFF); color: #fff; }
.modal-btn.save:disabled { opacity: 0.5; cursor: not-allowed; }
.modal-btn.cancel { background: transparent; border: 1px solid #606060; color: #B0B0C0; }

/* Пустой экран */
.empty { text-align: center; padding: 60px 20px; color: #606060; }
.empty-icon { font-size: 60px; margin-bottom: 12px; }

/* Загрузка */
.loading { text-align: center; padding: 40px; color: #00FFFF; }

/* Прогресс */
.progress {
  width: 100%; height: 6px; border-radius: 3px;
  background: #0A0A1A; overflow: hidden; margin-top: 10px;
}
.progress-bar {
  height: 100%; background: linear-gradient(90deg, #FF00FF, #00FFFF);
  width: 0%; transition: width 0.3s;
}
</style>
</head>
<body>

<!-- Шапка -->
<div class="header">
  <button class="back-btn" onclick="location.href='z4.html'">←</button>
  <div class="header-title">
    <h1>Псевдо диск L</h1>
    <p id="subtitle">Загрузка...</p>
  </div>
</div>

<!-- Контейнер -->
<div class="container">

  <!-- Поиск -->
  <div class="search-bar">
    <input type="text" class="search-input" id="search-input" placeholder="🔍 Поиск файлов..." oninput="render()">
  </div>

  <!-- Список файлов -->
  <div class="disk-list" id="disk-list">
    <div class="loading">Загрузка...</div>
  </div>

</div>

<!-- FAB -->
<button class="fab" id="fab" onclick="openAddModal()">
  📤 Загрузить
</button>

<!-- Модалка -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-title">Загрузить файл на диск L</div>

    <div class="form-group">
      <label class="form-label">Имя файла *</label>
      <input type="text" class="form-input" id="edit-name" placeholder="Отчёт за октябрь.xlsx">
    </div>

    <div class="form-group">
      <label class="form-label">Файл *</label>
      <div class="file-picker" id="file-picker" onclick="document.getElementById('file-input').click()">
        <span class="file-icon">📎</span>
        <span class="file-text" id="file-text">Нажмите, чтобы выбрать файл</span>
      </div>
      <input type="file" id="file-input" style="display:none;" onchange="onFileSelected(this)">
    </div>

    <div class="progress" id="progress" style="display:none;">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeModal()">Отмена</button>
      <button class="modal-btn save" id="save-btn" onclick="uploadFile()">Загрузить</button>
    </div>
  </div>
</div>

<script>
// ========== КОНФИГ ==========
const SB_URL = 'https://owkizfikhtiqbwftqgfd.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93a2l6ZmlraHRpcWJ3ZnRxZ2ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0OTYxMDYsImV4cCI6MjEwNzA3MjEwNn0.EHVyXiBYuSJrDVd_k5zAbwqT3ZPFF43p5Uh4_huKoOo';

window.SB = window.supabase.createClient(SB_URL, SB_KEY);

// ========== СОСТОЯНИЕ ==========
let currentUser = JSON.parse(localStorage.getItem('zenit-user') || 'null');
if (!currentUser) location.href = 'z4.html';

const ROLE_TITLES = {
  MANAGER: 'Менеджер',
  DEPUTY_DIRECTOR: 'Заместитель директора',
  DIRECTOR: 'Директор',
  TU: 'ТУ', OD: 'ОД', ID: 'ИД',
  MODERATOR_ZENIT: 'Модератор Zenit',
  LEAD_DEV_ZENIT: 'Ведущий разработчик Zenit'
};

const canEdit = currentUser.role !== 'MANAGER';

let selectedFile = null;
let allItems = [];

// ========== ЗАГОЛОВОК ==========
document.getElementById('subtitle').textContent = currentUser.name + ' · ' + (ROLE_TITLES[currentUser.role] || currentUser.role);

// ========== FAB ==========
if (!canEdit) {
  document.getElementById('fab').style.display = 'none';
}

// ========== ЗАГРУЗКА ==========
async function loadItems() {
  try {
    const { data, error } = await window.SB
      .from('disk_l')
      .select('*')
      .order('id', { ascending: false });

    if (error) throw error;

    allItems = data || [];
    render();
  } catch (e) {
    document.getElementById('disk-list').innerHTML = '<div class="empty">Ошибка: ' + e.message + '</div>';
    console.error(e);
  }
}

// ========== РЕНДЕР ==========
function render() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  let filtered = allItems;

  if (q) {
    filtered = filtered.filter(f =>
      (f.file_name || '').toLowerCase().includes(q) ||
      (f.author || '').toLowerCase().includes(q)
    );
  }

  const container = document.getElementById('disk-list');

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📁</div>
        <p>${q ? 'Ничего не найдено по «' + escapeHtml(q) + '»' : 'Диск пуст'}</p>
        ${canEdit && !q ? '<p style="font-size:12px; margin-top:8px;">Нажмите 📤 Загрузить, чтобы загрузить файл</p>' : ''}
      </div>`;
    return;
  }

  container.innerHTML = filtered.map(item => {
    const icon = getFileIcon(item.file_name);
    const isMine = item.author === currentUser.name;
    const canDelete = isMine || ['DIRECTOR', 'TU', 'OD', 'ID', 'MODERATOR_ZENIT', 'LEAD_DEV_ZENIT'].includes(currentUser.role);

    return `
      <div class="disk-card">
        <div class="disk-icon">${icon}</div>
        <div class="disk-info">
          <div class="disk-name">${escapeHtml(item.file_name)}</div>
          <div class="disk-meta">
            <span class="disk-size">${escapeHtml(item.file_size || '—')}</span>
            · <span class="disk-author">${escapeHtml(item.author)}</span>
          </div>
        </div>
        <div class="disk-actions">
          <button class="action-btn" onclick="openFile('${escapeAttr(item.file_url)}')" title="Открыть">👁</button>
          <button class="action-btn" onclick="downloadFile('${escapeAttr(item.file_url)}', '${escapeAttr(item.file_name)}')" title="Скачать">⬇</button>
          ${canDelete ? `<button class="action-btn pink" onclick="deleteItem(${item.id})" title="Удалить">🗑</button>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

// ========== ИКОНКИ ФАЙЛОВ ==========
function getFileIcon(name) {
  const ext = (name || '').split('.').pop().toLowerCase();
  const icons = {
    pdf: '📕', doc: '📘', docx: '📘',
    xls: '📗', xlsx: '📗', csv: '📗',
    ppt: '📙', pptx: '📙',
    zip: '🗜', rar: '🗜', '7z': '🗜',
    jpg: '🖼', jpeg: '🖼', png: '🖼', gif: '🖼', webp: '🖼',
    mp3: '🎵', wav: '🎵', ogg: '🎵',
    mp4: '🎬', avi: '🎬', mov: '🎬',
    txt: '📄', rtf: '📄',
  };
  return icons[ext] || '📎';
}

// ========== ОТКРЫТИЕ / СКАЧИВАНИЕ ==========
function openFile(url) {
  window.open(url, '_blank');
}

function downloadFile(url, fileName) {
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName || 'file';
  a.target = '_blank';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// ========== МОДАЛКА ==========
function openAddModal() {
  if (!canEdit) { alert('У вас нет прав для загрузки'); return; }
  selectedFile = null;
  document.getElementById('edit-name').value = '';
  document.getElementById('file-text').textContent = 'Нажмите, чтобы выбрать файл';
  document.getElementById('file-picker').classList.remove('active');
  document.getElementById('progress').style.display = 'none';
  document.getElementById('progress-bar').style.width = '0%';
  document.getElementById('save-btn').disabled = false;
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  selectedFile = null;
}

function onFileSelected(input) {
  const file = input.files[0];
  if (!file) return;

  selectedFile = file;
  document.getElementById('file-text').textContent = '📎 ' + file.name + ' (' + formatSize(file.size) + ')';
  document.getElementById('file-picker').classList.add('active');

  // Автозаполнение имени файла
  if (!document.getElementById('edit-name').value) {
    document.getElementById('edit-name').value = file.name;
  }

  input.value = '';
}

// ========== ЗАГРУЗКА ==========
async function uploadFile() {
  const fileName = document.getElementById('edit-name').value.trim();
  const btn = document.getElementById('save-btn');

  if (!fileName) { alert('Введите имя файла'); return; }
  if (!selectedFile) { alert('Выберите файл'); return; }

  btn.disabled = true;
  btn.textContent = 'Загрузка...';
  document.getElementById('progress').style.display = 'block';

  try {
    // Уникальное имя для Storage
    const uniqueName = 'diskl_' + Date.now() + '_' + selectedFile.name.replace(/[^a-zA-Z0-9._-]/g, '_');

    // Прогресс-имитация
    let progress = 0;
    const progressInterval = setInterval(() => {
      progress = Math.min(progress + 5, 90);
      document.getElementById('progress-bar').style.width = progress + '%';
    }, 100);

    // Загрузка
    const { error: uploadError } = await window.SB.storage
      .from('attachments')
      .upload(uniqueName, selectedFile);

    if (uploadError) throw uploadError;

    // Публичный URL
    const { data: urlData } = window.SB.storage
      .from('attachments')
      .getPublicUrl(uniqueName);

    clearInterval(progressInterval);
    document.getElementById('progress-bar').style.width = '100%';

    // Сохранение в БД
    const { error: dbError } = await window.SB.from('disk_l').insert({
      file_name: fileName,
      file_url: urlData.publicUrl,
      file_size: formatSize(selectedFile.size),
      author: currentUser.name,
      role: currentUser.role,
    });

    if (dbError) throw dbError;

    closeModal();
    await loadItems();
  } catch (e) {
    alert('Ошибка: ' + e.message);
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Загрузить';
  }
}

// ========== УДАЛЕНИЕ ==========
async function deleteItem(id) {
  if (!confirm('Удалить файл с диска L?')) return;
  try {
    const { error } = await window.SB.from('disk_l').delete().eq('id', id);
    if (error) throw error;
    await loadItems();
  } catch (e) {
    alert('Ошибка: ' + e.message);
  }
}

// ========== УТИЛИТЫ ==========
function escapeHtml(text) {
  if (!text) return '';
  return String(text).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function escapeAttr(text) {
  if (!text) return '';
  return String(text).replace(/'/g, "\\'");
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
}

// Закрытие по клику на фон
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') closeModal();
});

// ========== СТАРТ ==========
loadItems();

// Автообновление каждые 10 сек
setInterval(() => {
  if (!document.getElementById('search-input').value) loadItems();
}, 10000);
</script>
</body>
</html>
