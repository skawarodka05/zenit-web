<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ZENIT</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: #0A0A1A; color: #fff; min-height: 100vh; }
.hidden { display: none !important; }

/* Логин */
#login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
.login-box { width: 100%; max-width: 400px; }
.logo-circle { width: 140px; height: 140px; margin: 0 auto 20px; border-radius: 50%; background: linear-gradient(135deg, #FF00FF, #00FFFF); display: flex; align-items: center; justify-content: center; font-size: 56px; font-weight: 900; box-shadow: 0 0 30px rgba(0, 255, 255, 0.5); }
.logo-text { text-align: center; font-size: 32px; font-weight: 900; letter-spacing: 8px; margin-bottom: 32px; background: linear-gradient(135deg, #FF00FF, #00FFFF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.neon-input { width: 100%; padding: 14px 18px; border-radius: 12px; background: #14142B; border: 1px solid rgba(0, 255, 255, 0.5); color: #fff; font-size: 15px; outline: none; margin-bottom: 14px; }
.neon-input:focus { border-color: #00FFFF; box-shadow: 0 0 15px rgba(0, 255, 255, 0.4); }
.neon-input::placeholder { color: #B0B0C0; }
.gradient-btn { width: 100%; padding: 16px; border: none; border-radius: 12px; background: linear-gradient(90deg, #FF00FF, #00FFFF); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 0 20px rgba(0, 255, 255, 0.4); margin-bottom: 14px; }
.gradient-btn:disabled { opacity: 0.5; }
.outline-btn { width: 100%; padding: 16px; border: 1px solid #FF00FF; border-radius: 12px; background: transparent; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
.outline-btn:hover { background: rgba(255, 0, 255, 0.1); }
.error-text { color: #FF00FF; font-size: 14px; text-align: center; margin-bottom: 14px; padding: 8px; border-radius: 8px; background: rgba(255, 0, 255, 0.1); border: 1px solid rgba(255, 0, 255, 0.3); }

/* Дашборд */
#dashboard-screen { min-height: 100vh; padding: 24px 16px; }
.top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
.user-info { display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 6px; border-radius: 12px; }
.user-info:hover { background: rgba(0, 255, 255, 0.08); }
.user-avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #FF00FF, #00FFFF); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 20px; background-size: cover; background-position: center; flex-shrink: 0; }
.user-name { font-size: 16px; font-weight: 700; }
.user-role { font-size: 13px; color: #00FFFF; }
.top-actions { display: flex; gap: 8px; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; background: #14142B; border: 1px solid rgba(0, 255, 255, 0.5); color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.icon-btn.pink { border-color: #FF00FF; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
.card { background: #14142B; border: 1px solid rgba(0, 255, 255, 0.6); border-radius: 14px; padding: 16px; min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; text-align: center; transition: all 0.2s; }
.card:hover { transform: translateY(-4px); box-shadow: 0 0 20px rgba(0, 255, 255, 0.4); }
.card-icon { font-size: 40px; margin-bottom: 12px; }
.card-title { font-size: 14px; font-weight: 700; }

/* Светлая тема */
body.light-theme { background: #F5F5FA; color: #1A1A2E; }
body.light-theme .neon-input { background: #FFFFFF; border-color: #0088AA; color: #1A1A2E; }
body.light-theme .neon-input::placeholder { color: #606060; }
body.light-theme .card,
body.light-theme .icon-btn { background: #FFFFFF; border-color: #0088AA; color: #1A1A2E; }
body.light-theme .user-role { color: #0088AA; }
</style>
</head>
<body>

<!-- ЛОГИН -->
<div id="login-screen">
  <div class="login-box">
    <div class="logo-circle">Z</div>
    <div class="logo-text">ZENIT</div>
    <input type="email" id="email-input" class="neon-input" placeholder="Email">
    <input type="password" id="password-input" class="neon-input" placeholder="Пароль">
    <div id="login-error" class="error-text hidden"></div>
    <button id="login-btn" class="gradient-btn">ВОЙТИ</button>
    <button id="register-btn" class="outline-btn">Регистрация</button>
  </div>
</div>

<!-- ДАШБОРД -->
<div id="dashboard-screen" class="hidden">
  <div class="top-bar">
    <div class="user-info" onclick="showProfile()">
      <div class="user-avatar" id="user-avatar">?</div>
      <div>
        <div class="user-name" id="user-name">Гость</div>
        <div class="user-role" id="user-role">—</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="theme-btn" onclick="toggleTheme()">🌙</button>
      <button class="icon-btn pink" onclick="logout()">🚪</button>
    </div>
  </div>
  <input type="text" id="search-input" class="neon-input" placeholder="🔍 Поиск раздела..." oninput="filterCards()">
  <div class="grid" id="cards-grid" style="margin-top:24px;"></div>
</div>

<script>
// ========== КОНФИГ ==========
const SB_URL = 'https://owkizfikhtiqbwftqgfd.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93a2l6ZmlraHRpcWJ3ZnRxZ2ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0OTYxMDYsImV4cCI6MjEwNzA3MjEwNn0.EHVyXiBYuSJrDVd_k5zAbwqT3ZPFF43p5Uh4_huKoOo';

window.SB = window.supabase.createClient(SB_URL, SB_KEY);
console.log('✅ SB клиент создан');

// ========== РОЛИ ==========
const ROLE_TITLES = {
  MANAGER: 'Менеджер',
  DEPUTY_DIRECTOR: 'Заместитель директора',
  DIRECTOR: 'Директор',
  TU: 'ТУ', OD: 'ОД', ID: 'ИД',
  MODERATOR_ZENIT: 'Модератор Zenit',
  LEAD_DEV_ZENIT: 'Ведущий разработчик Zenit'
};

// ========== РАЗДЕЛЫ ==========
const SECTIONS = [
  { name: 'База Документов', icon: '📄' },
  { name: 'База Оборудования', icon: '⚙️' },
  { name: 'База Человечков', icon: '👥' },
  { name: 'База Контактов', icon: '📞' },
  { name: 'База АУП', icon: '🏢' },
  { name: 'База Алхимии', icon: '🧪' },
  { name: 'Почта дня', icon: '📧' },
  { name: 'База SAI Global', icon: '📊' },
  { name: 'Общение', icon: '💬' },
  { name: 'Псевдо диск L', icon: '💾' },
  { name: 'База слэнга', icon: '📖' }
];

// ========== СОСТОЯНИЕ ==========
let currentUser = null;
let currentTheme = localStorage.getItem('zenit-theme') || 'dark';

// ========== ВХОД ==========
async function handleLogin() {
  const email = document.getElementById('email-input').value.trim();
  const password = document.getElementById('password-input').value;
  const errorEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');

  errorEl.classList.add('hidden');

  if (!email || !password) {
    errorEl.textContent = 'Введите email и пароль';
    errorEl.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Вход...';

  try {
    const { data, error } = await window.SB.from('users')
      .select('*')
      .eq('email', email)
      .eq('password', password);

    if (error) {
      errorEl.textContent = 'Ошибка: ' + error.message;
      errorEl.classList.remove('hidden');
      return;
    }

    if (!data || data.length === 0) {
      errorEl.textContent = 'Неверный email или пароль';
      errorEl.classList.remove('hidden');
      return;
    }

    currentUser = data[0];
    localStorage.setItem('zenit-user', JSON.stringify(currentUser));
    showDashboard();
  } catch (e) {
    errorEl.textContent = 'Ошибка: ' + e.message;
    errorEl.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = 'ВОЙТИ';
  }
}

// ========== РЕГИСТРАЦИЯ — ОТКРЫТИЕ ОТДЕЛЬНОЙ СТРАНИЦЫ ==========
function showRegister() {
  location.href = 'register.html';
}

// ========== ДАШБОРД ==========
function showDashboard() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('dashboard-screen').classList.remove('hidden');

  if (!currentUser) return;

  const initial = currentUser.name ? currentUser.name.charAt(0).toUpperCase() : '?';
  const av = document.getElementById('user-avatar');
  av.textContent = initial;
  av.style.backgroundImage = currentUser.avatar_url ? `url('${currentUser.avatar_url}')` : '';

  document.getElementById('user-name').textContent = currentUser.name || 'Гость';
  document.getElementById('user-role').textContent = ROLE_TITLES[currentUser.role] || currentUser.role;

  renderCards(SECTIONS);
}

function renderCards(sections) {
  document.getElementById('cards-grid').innerHTML = sections.map(s => `
    <div class="card" onclick="openSection('${s.name}')">
      <div class="card-icon">${s.icon}</div>
      <div class="card-title">${s.name}</div>
    </div>`).join('');
}

function filterCards() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  renderCards(q ? SECTIONS.filter(s => s.name.toLowerCase().includes(q)) : SECTIONS);
}

// ========== ОТКРЫТИЕ РАЗДЕЛА ==========
function openSection(name) {
  if (name === 'Общение') {
    location.href = 'messenger.html';
    return;
  }

  const chatSections = [
    'База Документов', 'База Оборудования', 'База Человечков',
    'База АУП', 'База Алхимии', 'Почта дня'
  ];

  const pageMap = {
    'База Контактов': 'contacts.html',
    'База SAI Global': 'sai.html',
    'Псевдо диск L': 'disk_l.html',
    'База слэнга': 'slang.html',
  };

  if (chatSections.includes(name)) {
    location.href = 'chat.html?db=' + encodeURIComponent(name);
    return;
  }

  if (pageMap[name]) {
    location.href = pageMap[name];
    return;
  }

  alert('Раздел: "' + name + '"\nБудет добавлен позже.');
}

// ========== ПРОФИЛЬ ==========
function showProfile() {
  location.href = 'profile.html';
}

// ========== ВЫХОД ==========
function logout() {
  if (!confirm('Выйти из аккаунта?')) return;
  currentUser = null;
  localStorage.removeItem('zenit-user');
  document.getElementById('dashboard-screen').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('email-input').value = '';
  document.getElementById('password-input').value = '';
}

// ========== ТЕМА ==========
function toggleTheme() {
  const themes = ['dark', 'light', 'system'];
  currentTheme = themes[(themes.indexOf(currentTheme) + 1) % themes.length];
  localStorage.setItem('zenit-theme', currentTheme);
  applyTheme();
}

function applyTheme() {
  const icons = { dark: '🌙', light: '☀️', system: '⚙️' };
  const btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = icons[currentTheme];

  const isDark = currentTheme === 'dark' ||
    (currentTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);

  document.body.classList.toggle('light-theme', !isDark);
}

// ========== ВОССТАНОВЛЕНИЕ СЕССИИ ==========
function restoreSession() {
  const saved = localStorage.getItem('zenit-user');
  if (saved) {
    try {
      currentUser = JSON.parse(saved);
      showDashboard();
      return true;
    } catch (e) {
      localStorage.removeItem('zenit-user');
    }
  }
  return false;
}

// ========== ОБРАБОТЧИКИ ==========
document.getElementById('login-btn').addEventListener('click', handleLogin);
document.getElementById('register-btn').addEventListener('click', showRegister);
document.getElementById('password-input').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') handleLogin();
});

// ========== СТАРТ ==========
applyTheme();
if (!restoreSession()) document.getElementById('login-screen').classList.remove('hidden');
console.log('🚀 ZENIT запущен');
</script>
</body>
</html>
