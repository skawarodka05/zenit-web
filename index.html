<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="icon" type="image/png" href="logo_zenit.png?v=1">
<title>ZENIT · Главная</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: #0A0A1A; color: #fff; min-height: 100vh; overflow-x: hidden; }

#wave-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; opacity: 0.7; }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #00FFFF; border-radius: 4px; }

.header { display: flex; align-items: center; gap: 12px; padding: 16px; background: rgba(20, 20, 43, 0.85); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0, 255, 255, 0.3); position: sticky; top: 0; z-index: 100; }
.logo-wrap { display: flex; align-items: center; gap: 12px; flex: 1; text-decoration: none; color: inherit; }
.logo-img { width: 44px; height: 44px; object-fit: contain; }
.logo-text h1 { font-size: 22px; font-weight: 900; letter-spacing: 1px; }
.logo-text p { font-size: 13px; color: #00FFFF; }
.header-btn { width: 44px; height: 44px; border-radius: 12px; background: #0A0A1A; border: 1px solid rgba(0, 255, 255, 0.5); color: #00FFFF; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: all 0.2s; }
.header-btn:hover { background: rgba(0, 255, 255, 0.15); }
.header-btn.pink { border-color: rgba(255, 0, 255, 0.5); color: #FF00FF; }
.header-btn.pink:hover { background: rgba(255, 0, 255, 0.15); }

.container { max-width: 1100px; margin: 0 auto; padding: 16px; position: relative; z-index: 1; }
.user-card { background: rgba(20, 20, 43, 0.85); backdrop-filter: blur(5px); border: 1px solid rgba(255, 0, 255, 0.5); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: #fff; transition: all 0.2s; }
.user-card:hover { background: rgba(20, 20, 43, 0.95); }
.user-name { font-size: 16px; font-weight: 700; }
.user-profile-link { font-size: 13px; color: #00FFFF; font-weight: bold; }

.search-bar { margin-bottom: 24px; }
.search-input { width: 100%; padding: 14px 18px; border-radius: 12px; background: rgba(20, 20, 43, 0.85); backdrop-filter: blur(5px); border: 1px solid rgba(0, 255, 255, 0.5); color: #fff; font-size: 15px; outline: none; transition: all 0.2s; }
.search-input:focus { border-color: #00FFFF; box-shadow: 0 0 12px rgba(0, 255, 255, 0.3); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.db-card { position: relative; background: rgba(20, 20, 43, 0.85); backdrop-filter: blur(5px); border: 1px solid rgba(0, 255, 255, 0.5); border-radius: 14px; overflow: hidden; text-decoration: none; color: #fff; display: flex; flex-direction: column; transition: all 0.2s; }
.db-card:hover { border-color: #00FFFF; box-shadow: 0 0 15px rgba(0, 255, 255, 0.2); transform: translateY(-2px); }

.notification-badge { position: absolute; top: 10px; right: 10px; background: #FF00FF; color: #fff; font-size: 12px; font-weight: 900; padding: 4px 8px; border-radius: 20px; box-shadow: 0 0 10px rgba(255, 0, 255, 0.8); z-index: 10; animation: pulse-badge 2s infinite; }
@keyframes pulse-badge { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

.db-image { width: 100%; height: 280px; border-bottom: 1px solid rgba(0, 255, 255, 0.3); position: relative; background: #0A0A1A; overflow: hidden; }
.db-image img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
.db-image-placeholder { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: flex; align-items: center; justify-content: center; font-size: 56px; background: linear-gradient(135deg, rgba(255,0,255,0.4), rgba(0,255,255,0.4)); }

.db-title { padding: 16px 12px; font-size: 16px; font-weight: 700; text-align: center; flex-grow: 1; display: flex; align-items: center; justify-content: center; }
.empty { text-align: center; padding: 60px 20px; color: #606060; grid-column: 1 / -1; }

#toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
.toast { background: #14142B; color: #fff; padding: 16px 20px; border-radius: 12px; border-left: 4px solid #00FFFF; box-shadow: 0 5px 15px rgba(0,0,0,0.5); font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; transform: translateX(120%); transition: transform 0.3s; }
.toast.show { transform: translateX(0); }
.toast.error { border-left-color: #FF00FF; }
#confirm-modal { position: fixed; inset: 0; background: rgba(10, 10, 26, 0.8); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 10000; opacity: 0; transition: opacity 0.2s; }
#confirm-modal.show { display: flex; opacity: 1; }
.confirm-box { background: #14142B; border: 1px solid #00FFFF; border-radius: 16px; padding: 24px; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 0 30px rgba(0, 255, 255, 0.2); transform: scale(0.9); transition: transform 0.2s; }
#confirm-modal.show .confirm-box { transform: scale(1); }
.confirm-title { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 10px; }
.confirm-text { font-size: 14px; color: #B0B0C0; margin-bottom: 24px; line-height: 1.5; }
.confirm-actions { display: flex; gap: 10px; }
.confirm-btn { flex: 1; padding: 14px; border-radius: 12px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
.confirm-btn.cancel { background: transparent; border: 1px solid #606060; color: #B0B0C0; }
.confirm-btn.danger { background: rgba(255, 0, 255, 0.15); border: 1px solid #FF00FF; color: #FF00FF; }
</style>
</head>
<body>

<canvas id="wave-bg"></canvas>
<div id="toast-container"></div>
<div id="confirm-modal">
    <div class="confirm-box">
        <div class="confirm-title" id="confirm-title">Вы уверены?</div>
        <div class="confirm-text" id="confirm-text">Это действие нельзя отменить.</div>
        <div class="confirm-actions">
            <button class="confirm-btn cancel" onclick="closeConfirm()">Отмена</button>
            <button class="confirm-btn danger" id="confirm-yes-btn">Подтвердить</button>
        </div>
    </div>
</div>

<div class="header">
  <a href="index.html" class="logo-wrap">
    <img src="logo_zenit.png" alt="ZENIT" class="logo-img" onerror="this.style.display='none'">
    <div class="logo-text"><h1>ZENIT</h1><p id="header-role">Гость</p></div>
  </a>
  <a href="tasks.html" class="header-btn" title="Мой Чек-лист">✅</a>
  <button class="header-btn pink" onclick="askLogout()" title="Выйти">🚪</button>
</div>

<div class="container">
  <a href="#" id="profile-link" class="user-card">
    <div class="user-name" id="user-name">Гость</div>
    <div class="user-profile-link" id="profile-action">Войти →</div>
  </a>

  <div class="search-bar">
    <input type="text" class="search-input" id="search-input" placeholder="🔍 Поиск раздела...">
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
const canvas = document.getElementById('wave-bg');
const ctx = canvas.getContext('2d');
let width, height;
function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();
let time = 0;
function drawWaves() {
    ctx.clearRect(0, 0, width, height);
    drawWave(0.004, 120, 0.06, 'rgba(0, 255, 255, 0.15)');  
    drawWave(0.006, 90, 0.08, 'rgba(255, 0, 255, 0.1)');    
    drawWave(0.003, 150, 0.04, 'rgba(0, 255, 255, 0.05)');  
    time += 0.05; requestAnimationFrame(drawWaves);
}
function drawWave(frequency, amplitude, speed, color) {
    ctx.beginPath(); ctx.moveTo(0, height);
    for (let x = 0; x <= width; x++) {
        const y = height / 2 + Math.sin(x * frequency + time * speed) * amplitude + Math.sin(x * frequency * 2 + time * speed * 1.5) * (amplitude / 2);
        ctx.lineTo(x, y);
    }
    ctx.lineTo(width, height); ctx.closePath(); ctx.fillStyle = color; ctx.fill();
}
drawWaves();

const SB_URL = 'https://owkizfikhtiqbwftqgfd.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93a2l6ZmlraHRpcWJ3ZnRxZ2ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0OTYxMDYsImV4cCI6MjEwNzA3MjEwNn0.EHVyXiBYuSJrDVd_k5zAbwqT3ZPFF43p5Uh4_huKoOo';
window.SB = window.supabase.createClient(SB_URL, SB_KEY);

const ROLE_TITLES = { MANAGER: 'Менеджер', DEPUTY_DIRECTOR: 'Заместитель директора', DIRECTOR: 'Директор', TU: 'ТУ', OD: 'ОД', ID: 'ИД', MODERATOR_ZENIT: 'Модератор Zenit', LEAD_DEV_ZENIT: 'Ведущий разработчик Zenit', TRAINEE: 'Стажёр', CHBR: 'ЧБР', UNIVERSAL: 'Универсал', TRAINER: 'Тренер', SHIFT_TRAINER: 'Тренер шифт' };

const ALL_ITEMS = [
  { name: 'Мой Чек-лист', image: 'https://raw.githubusercontent.com/skawarodka05/zenit-web/main/banner_tasks.jpg', link: 'tasks.html', emoji: '✅' },
  { name: 'Общение', image: 'banner_communication.jpg', link: 'messenger.html', emoji: '💬' },
  { name: 'База Контактов', image: 'banner_contacts.jpg', link: 'contacts.html', emoji: '📞' },
  { name: 'Сайты БК', image: 'banner_links.jpg', link: 'links.html', emoji: '🌐' },
  { name: 'База аксапты', image: 'banner_axapta.jpg', link: 'chat.html?db=База аксапты', emoji: '🏭' },
  { name: 'База обмана', image: 'banner_fraud.jpg', link: 'chat.html?db=База обмана', emoji: '🚨' }, // 👈 НОВАЯ ПАПКА
  { name: 'База Документов', image: 'banner_docs.jpg', link: 'chat.html?db=База Документов', emoji: '📄' },
  { name: 'База Продуктов', image: 'banner_products.jpg', link: 'chat.html?db=База Продуктов', emoji: '🛒' },
  { name: 'База Оборудования', image: 'banner_equipment.jpg', link: 'chat.html?db=База Оборудования', emoji: '⚙️' },
  { name: 'База Человечков', image: 'banner_people.jpg', link: 'chat.html?db=База Человечков', emoji: '👥' },
  { name: 'База АУП', image: 'banner_aup.jpg', link: 'chat.html?db=База АУП', emoji: '🏢' },
  { name: 'База Алхимии', image: 'banner_alchemy.jpg', link: 'chat.html?db=База Алхимии', emoji: '🧪' },
  { name: 'Почта дня', image: 'banner_mail.jpg', link: 'chat.html?db=Почта дня', emoji: '📧' },
  { name: 'База SAI Global', image: 'banner_sai.jpg', link: 'sai.html', emoji: '📊' },
  { name: 'Псевдо диск L', image: 'banner_disk_l.jpg', link: 'disk_l.html', emoji: '💾' },
  { name: 'База слэнга', image: 'banner_slang.jpg', link: 'slang.html', emoji: '📚' },
  { name: 'База ЧБР', image: 'banner_chbr.jpg', link: 'chat.html?db=База ЧБР', emoji: '🏢' }
];

const RESTRICTED_ROLES = ['TRAINEE', 'CHBR', 'UNIVERSAL', 'TRAINER', 'SHIFT_TRAINER'];
const HIDDEN_FOLDERS = ['База Документов', 'База Человечков', 'База Контактов', 'База АУП', 'Почта дня', 'Псевдо диск L'];

let currentUser = null;
let displayItems = [];

function getUser() {
    try { const raw = localStorage.getItem('zenit-user'); if (!raw || raw === 'undefined') return null; return JSON.parse(raw); } catch(e) { return null; }
}

function getFilteredItems() {
    if (!currentUser || !RESTRICTED_ROLES.includes(currentUser.role)) return ALL_ITEMS;
    return ALL_ITEMS.filter(item => !HIDDEN_FOLDERS.includes(item.name));
}

async function checkNotifications() {
    if (!currentUser) return;

    try {
        const { data, error } = await window.SB.from('posts').select('database_name, created_at').order('created_at', { ascending: false }).limit(100);
        if (error) throw error;

        let counts = {};
        
        data.forEach(post => {
            const db = post.database_name;
            const postTime = new Date(post.created_at).getTime();
            
            const lastViewStr = localStorage.getItem('zenit_read_' + currentUser.email + '_' + db);
            const lastViewTime = lastViewStr ? new Date(lastViewStr).getTime() : 0;
            
            if (postTime > lastViewTime) {
                counts[db] = (counts[db] || 0) + 1;
            }
        });
        
        displayItems.forEach(item => {
            const card = document.querySelector(`.db-card[data-name="${item.name}"]`);
            if (card) {
                const existingBadge = card.querySelector('.notification-badge');
                if (existingBadge) existingBadge.remove();

                if (counts[item.name] > 0) {
                    const badge = document.createElement('div');
                    badge.className = 'notification-badge';
                    badge.textContent = counts[item.name];
                    card.appendChild(badge);
                }
            }
        });
    } catch(e) { console.error("Ошибка проверки уведомлений:", e); }
}

function drawGrid(items) {
    const grid = document.getElementById('grid');
    if (!grid) return;
    if (items.length === 0) { grid.innerHTML = '<div class="empty">Ничего не найдено</div>'; return; }
    let html = '';
    items.forEach(item => {
        let imgHtml = item.image 
            ? `<div class="db-image"><img src="${item.image}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><div class="db-image-placeholder" style="display:none;">${item.emoji}</div></div>`
            : `<div class="db-image"><div class="db-image-placeholder">${item.emoji}</div></div>`;
        html += `<a href="${item.link}" class="db-card" data-name="${item.name}">${imgHtml}<div class="db-title">${item.name}</div></a>`;
    });
    grid.innerHTML = html;
    checkNotifications();
}

function showToast(message, isError = false) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast' + (isError ? ' error' : '');
    toast.innerHTML = `<span>${isError ? '❌' : '✅'}</span> <span>${message}</span>`;
    container.appendChild(toast);
    setTimeout(() => toast.classList.add('show'), 10);
    setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
}

function showConfirm(title, text, onConfirm, btnText = 'Подтвердить') {
    document.getElementById('confirm-title').textContent = title;
    document.getElementById('confirm-text').textContent = text;
    const btn = document.getElementById('confirm-yes-btn');
    btn.textContent = btnText;
    const actionToPerform = onConfirm;
    btn.onclick = () => { closeConfirm(); if(actionToPerform) actionToPerform(); };
    document.getElementById('confirm-modal').classList.add('show');
}
function closeConfirm() { document.getElementById('confirm-modal').classList.remove('show'); }

function askLogout() {
    showConfirm('Выйти из аккаунта?', 'Вам придется заново ввести логин и пароль.', () => {
        localStorage.removeItem('zenit-user'); showToast('Вы вышли из аккаунта');
        setTimeout(() => { location.href = 'login.html'; }, 1000);
    }, 'Выйти');
}

document.addEventListener('DOMContentLoaded', () => {
    currentUser = getUser();
    if (currentUser && currentUser.name) {
        document.getElementById('user-name').textContent = currentUser.name;
        document.getElementById('header-role').textContent = ROLE_TITLES[currentUser.role] || currentUser.role || 'Сотрудник';
        document.getElementById('profile-link').href = 'profile.html';
        document.getElementById('profile-action').textContent = 'Профиль →';
    } else {
        document.getElementById('user-name').textContent = 'Гость';
        document.getElementById('header-role').textContent = 'Требуется вход';
        document.getElementById('profile-link').href = 'login.html';
        document.getElementById('profile-action').textContent = 'Войти →';
    }

    displayItems = getFilteredItems();
    drawGrid(displayItems);

    document.getElementById('search-input').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase().trim();
        const filtered = q ? displayItems.filter(i => i.name.toLowerCase().includes(q)) : displayItems;
        drawGrid(filtered);
    });
});

window.addEventListener('pageshow', (event) => {
    if (event.persisted || performance.getEntriesByType("navigation")[0].type === "back_forward") {
        if (displayItems.length > 0) checkNotifications();
    }
});

// 🔄 АВТООБНОВЛЕНИЕ УВЕДОМЛЕНИЙ КАЖДЫЕ 15 СЕКУНД
setInterval(() => {
    if (currentUser && displayItems.length > 0) {
        checkNotifications();
    }
}, 15000);
</script>
</body>
</html>
