<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ZENIT · Главная</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: #0A0A1A; color: #fff; min-height: 100vh; }

.header { display: flex; align-items: center; gap: 12px; padding: 16px; background: #14142B; border-bottom: 1px solid rgba(0, 255, 255, 0.3); position: sticky; top: 0; z-index: 100; }
.logo-wrap { display: flex; align-items: center; gap: 12px; cursor: pointer; flex: 1; text-decoration: none; color: inherit; }
.logo-img { width: 44px; height: 44px; object-fit: contain; }
.logo-text h1 { font-size: 22px; font-weight: 900; letter-spacing: 1px; }
.logo-text p { font-size: 13px; color: #00FFFF; }
.header-btn { width: 44px; height: 44px; border-radius: 12px; background: #0A0A1A; border: 1px solid rgba(0, 255, 255, 0.5); color: #00FFFF; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: all 0.2s; }
.header-btn:hover { background: rgba(0, 255, 255, 0.15); }
.header-btn.pink { border-color: rgba(255, 0, 255, 0.5); color: #FF00FF; }

.container { max-width: 900px; margin: 0 auto; padding: 16px; }
.user-card { background: #14142B; border: 1px solid rgba(255, 0, 255, 0.5); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: #fff; }
.user-name { font-size: 16px; font-weight: 700; }
.user-profile-link { font-size: 13px; color: #00FFFF; }

.search-bar { margin-bottom: 24px; }
.search-input { width: 100%; padding: 14px 18px; border-radius: 12px; background: #14142B; border: 1px solid rgba(0, 255, 255, 0.5); color: #fff; font-size: 15px; outline: none; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
.db-card { background: #14142B; border: 1px solid rgba(0, 255, 255, 0.5); border-radius: 14px; overflow: hidden; text-decoration: none; color: #fff; display: flex; flex-direction: column; transition: all 0.2s; }
.db-card:hover { border-color: #00FFFF; box-shadow: 0 0 15px rgba(0, 255, 255, 0.2); }

.db-image { width: 100%; height: 140px; border-bottom: 1px solid rgba(0, 255, 255, 0.3); position: relative; background: #0A0A1A; }
.db-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
.db-image-placeholder { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: flex; align-items: center; justify-content: center; font-size: 48px; background: linear-gradient(135deg, rgba(255,0,255,0.4), rgba(0,255,255,0.4)); }
.db-title { padding: 12px; font-size: 14px; font-weight: 700; text-align: center; }
.empty { text-align: center; padding: 60px 20px; color: #606060; grid-column: 1 / -1; }
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="logo-wrap">
    <img src="logo_zenit.png" alt="ZENIT" class="logo-img" onerror="this.style.display='none'">
    <div class="logo-text">
      <h1>ZENIT</h1>
      <p id="header-role">Загрузка...</p>
    </div>
  </a>
  <a href="tasks.html" class="header-btn" title="Мой Чек-лист">✅</a>
  <button class="header-btn pink" onclick="logout()" title="Выйти">🚪</button>
</div>

<div class="container">
  <a href="profile.html" class="user-card">
    <div class="user-name" id="user-name">Загрузка...</div>
    <div class="user-profile-link">Профиль →</div>
  </a>

  <div class="search-bar">
    <input type="text" class="search-input" id="search-input" placeholder="🔍 Поиск раздела..." oninput="filterItems()">
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
// Конфигурация
const ROLE_TITLES = {
  MANAGER: 'Менеджер', DEPUTY_DIRECTOR: 'Заместитель директора', DIRECTOR: 'Директор',
  TU: 'ТУ', OD: 'ОД', ID: 'ИД', MODERATOR_ZENIT: 'Модератор Zenit', LEAD_DEV_ZENIT: 'Ведущий разработчик Zenit'
};

// Данные карточек
const DB_ITEMS = [
  { name: 'Мой Чек-лист', image: 'https://raw.githubusercontent.com/skawarodka05/zenit-web/main/banner_tasks.jpg', link: 'tasks.html', emoji: '✅' },
  { name: 'База Документов', image: 'banner_docs.jpg', link: 'chat.html?db=База Документов', emoji: '📄' },
  { name: 'База Продуктов', image: 'banner_products.jpg', link: 'chat.html?db=База Продуктов', emoji: '🛒' },
  { name: 'База Оборудования', image: 'banner_equipment.jpg', link: 'chat.html?db=База Оборудования', emoji: '⚙️' },
  { name: 'База Человечков', image: 'banner_people.jpg', link: 'chat.html?db=База Человечков', emoji: '👥' },
  { name: 'База Контактов', image: 'banner_contacts.jpg', link: 'contacts.html', emoji: '📞' },
  { name: 'База АУП', image: 'banner_aup.jpg', link: 'chat.html?db=База АУП', emoji: '🏢' },
  { name: 'База Алхимии', image: 'banner_alchemy.jpg', link: 'chat.html?db=База Алхимии', emoji: '🧪' },
  { name: 'Почта дня', image: 'banner_mail.jpg', link: 'chat.html?db=Почта дня', emoji: '📧' },
  { name: 'База SAI Global', image: 'banner_sai.jpg', link: 'sai.html', emoji: '📊' },
  { name: 'Общение', image: 'banner_communication.jpg', link: 'messenger.html', emoji: '💬' },
  { name: 'Псевдо диск L', image: 'banner_disk_l.jpg', link: 'disk_l.html', emoji: '💾' },
  { name: 'База слэнга', image: 'banner_slang.jpg', link: 'slang.html', emoji: '📚' }
];

// 1. Пытаемся взять юзера (если ошибка - просто игнорим)
let user = null;
try { user = JSON.parse(localStorage.getItem('zenit-user')); } catch(e) {}

// 2. Заполняем шапку
if (user) {
  document.getElementById('user-name').textContent = user.name || 'Гость';
  document.getElementById('header-role').textContent = ROLE_TITLES[user.role] || user.role || '';
}

// 3. Рисуем сетку
function renderGrid(items) {
  const grid = document.getElementById('grid');
  if (items.length === 0) {
    grid.innerHTML = '<div class="empty">Ничего не найдено</div>';
    return;
  }
  
  let html = '';
  items.forEach(item => {
    let imgHtml = '';
    if (item.image) {
      imgHtml = `
        <div class="db-image">
          <img src="${item.image}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="db-image-placeholder" style="display:none;">${item.emoji}</div>
        </div>`;
    } else {
      imgHtml = `<div class="db-image"><div class="db-image-placeholder">${item.emoji}</div></div>`;
    }
    
    html += `
      <a href="${item.link}" class="db-card">
        ${imgHtml}
        <div class="db-title">${item.name}</div>
      </a>`;
  });
  
  grid.innerHTML = html;
}

// 4. Поиск
function filterItems() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  if (!q) {
    renderGrid(DB_ITEMS);
  } else {
    const filtered = DB_ITEMS.filter(i => i.name.toLowerCase().includes(q));
    renderGrid(filtered);
  }
}

// 5. Выход
function logout() {
  if (!confirm('Выйти из аккаунта?')) return;
  localStorage.removeItem('zenit-user');
  location.href = 'register.html'; 
}

// 6. Запуск
renderGrid(DB_ITEMS);
</script>
</body>
</html>
