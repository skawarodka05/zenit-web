<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="icon" type="image/png" href="logo_zenit.png?v=1">
<title>ZENIT · Главная</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: #0A0A1A; color: #fff; min-height: 100vh; overflow-x: hidden; }
#wave-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; opacity: 0.7; }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #00FFFF; border-radius: 4px; }
.header { display: flex; align-items: center; gap: 12px; padding: 16px; background: rgba(20, 20, 43, 0.85); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0, 255, 255, 0.3); position: sticky; top: 0; z-index: 100; }
.logo-wrap { display: flex; align-items: center; gap: 12px; flex: 1; text-decoration: none; color: inherit; }
.logo-img { width: 44px; height: 44px; object-fit: contain; }
.logo-text h1 { font-size: 22px; font-weight: 900; letter-spacing: 1px; }
.logo-text p { font-size: 13px; color: #00FFFF; }
.header-btn { width: 44px; height: 44px; border-radius: 12px; background: #0A0A1A; border: 1px solid rgba(0, 255, 255, 0.5); color: #00FFFF; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: all 0.2s; }
.header-btn:hover { background: rgba(0, 255, 255, 0.15); }
.header-btn.pink { border-color: rgba(255, 0, 255, 0.5); color: #FF00FF; }
.header-btn.pink:hover { background: rgba(255, 0, 255, 0.15); }
.container { max-width: 1100px; margin: 0 auto; padding: 16px; position: relative; z-index: 1; }
.user-card { background: rgba(20, 20, 43, 0.85); backdrop-filter: blur(5px); border: 1px solid rgba(255, 0, 255, 0.5); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: #fff; transition: all 0.2s; }
.user-card:hover { background: rgba(20, 20, 43, 0.95); }
.user-name { font-size: 16px; font-weight: 700; }
.user-profile-link { font-size: 13px; color: #00FFFF; font-weight: bold; }
.search-bar { margin-bottom: 24px; }
.search-input { width: 100%; padding: 14px 18px; border-radius: 12px; background: rgba(20, 20, 43, 0.85); backdrop-filter: blur(5px); border: 1px solid rgba(0, 255, 255, 0.5); color: #fff; font-size: 15px; outline: none; transition: all 0.2s; }
.search-input:focus { border-color: #00FFFF; box-shadow: 0 0 12px rgba(0, 255, 255, 0.3); }

/* 🎵 ВИДЖЕТ */
.music-widget { margin-bottom: 24px; border-radius: 14px; overflow: hidden; border: 1px solid rgba(0, 255, 255, 0.4); box-shadow: 0 0 15px rgba(0, 255, 255, 0.1); background: #14142B; transition: all 0.3s ease; }
.music-widget:hover { border-color: #00FFFF; box-shadow: 0 0 20px rgba(0, 255, 255, 0.3); }
.playlist-selector { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: rgba(10, 10, 26, 0.6); border-bottom: 1px solid rgba(0, 255, 255, 0.2); }
.playlist-selector label { font-size: 14px; font-weight: 700; color: #00FFFF; white-space: nowrap; }
.custom-select { flex: 1; padding: 10px 14px; border-radius: 8px; background: #0A0A1A; border: 1px solid rgba(255, 0, 255, 0.4); color: #fff; font-size: 14px; font-weight: 600; outline: none; cursor: pointer; appearance: none; -webkit-appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23FF00FF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 14px top 50%; background-size: 12px auto; transition: all 0.2s; }
.custom-select:focus, .custom-select:hover { border-color: #FF00FF; box-shadow: 0 0 10px rgba(255, 0, 255, 0.2); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.db-card { background: rgba(20, 20, 43, 0.85); backdrop-filter: blur(5px); border: 1px solid rgba(0, 255, 255, 0.5); border-radius: 14px; overflow: hidden; text-decoration: none; color: #fff; display: flex; flex-direction: column; transition: all 0.2s; }
.db-card:hover { border-color: #00FFFF; box-shadow: 0 0 15px rgba(0, 255, 255, 0.2); transform: translateY(-2px); }
.db-image { width: 100%; height: 280px; border-bottom: 1px solid rgba(0, 255, 255, 0.3); position: relative; background: #0A0A1A; overflow: hidden; }
.db-image img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
.db-image-placeholder { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: flex; align-items: center; justify-content: center; font-size: 56px; background: linear-gradient(135deg, rgba(255,0,255,0.4), rgba(0,255,255,0.4)); }
.db-title { padding: 16px 12px; font-size: 16px; font-weight: 700; text-align: center; flex-grow: 1; display: flex; align-items: center; justify-content: center; }
.empty { text-align: center; padding: 60px 20px; color: #606060; grid-column: 1 / -1; }
#toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
.toast { background: #14142B; color: #fff; padding: 16px 20px; border-radius: 12px; border-left: 4px solid #00FFFF; box-shadow: 0 5px 15px rgba(0,0,0,0.5); font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; transform: translateX(120%); transition: transform 0.3s; }
.toast.show { transform: translateX(0); }
.toast.error { border-left-color: #FF00FF; }
#confirm-modal { position: fixed; inset: 0; background: rgba(10, 10, 26, 0.8); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 10000; opacity: 0; transition: opacity 0.2s; }
#confirm-modal.show { display: flex; opacity: 1; }
.confirm-box { background: #14142B; border: 1px solid #00FFFF; border-radius: 16px; padding: 24px; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 0 30px rgba(0, 255, 255, 0.2); transform: scale(0.9); transition: transform 0.2s; }
#confirm-modal.show .confirm-box { transform: scale(1); }
.confirm-title { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 10px; }
.confirm-text { font-size: 14px; color: #B0B0C0; margin-bottom: 24px; line-height: 1.5; }
.confirm-actions { display: flex; gap: 10px; }
.confirm-btn { flex: 1; padding: 14px; border-radius: 12px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
.confirm-btn.cancel { background: transparent; border: 1px solid #606060; color: #B0B0C0; }
.confirm-btn.danger { background: rgba(255, 0, 255, 0.15); border: 1px solid #FF00FF; color: #FF00FF; }
</style>
</head>
<body>
<canvas id="wave-bg"></canvas>
<div id="toast-container"></div>
<div id="confirm-modal">
    <div class="confirm-box">
        <div class="confirm-title" id="confirm-title">Вы уверены?</div>
        <div class="confirm-text" id="confirm-text">Это действие нельзя отменить.</div>
        <div class="confirm-actions">
            <button class="confirm-btn cancel" onclick="closeConfirm()">Отмена</button>
            <button class="confirm-btn danger" id="confirm-yes-btn">Подтвердить</button>
        </div>
    </div>
</div>
<div class="header">
  <a href="index.html" class="logo-wrap">
    <img src="logo_zenit.png" alt="ZENIT" class="logo-img" onerror="this.style.display='none'">
    <div class="logo-text"><h1>ZENIT</h1><p id="header-role">Гость</p></div>
  </a>
  <a href="tasks.html" class="header-btn" title="Мой Чек-лист">✅</a>
  <button class="header-btn pink" onclick="askLogout()" title="Выйти">🚪</button>
</div>
<div class="container">
  <a href="#" id="profile-link" class="user-card">
    <div class="user-name" id="user-name">Гость</div>
    <div class="user-profile-link" id="profile-action">Войти →</div>
  </a>
  <div class="search-bar">
    <input type="text" class="search-input" id="search-input" placeholder="🔍 Поиск раздела...">
  </div>

  <!-- 🎵 ВИДЖЕТ С ПРАВИЛЬНЫМИ ПРИМЕРАМИ -->
  <div class="music-widget">
    <div class="playlist-selector">
      <label>🎵 Плейлист:</label>
      <select class="custom-select" id="playlist-select">
        <!-- 
          ВАЖНО: Замените эти ссылки на HTML-код ваших плейлистов!
          Формат: https://music.yandex.ru/iframe/playlist/USERNAME/ID
        -->
        <option value="https://music.yandex.ru/iframe/playlist/trj-voron/1004">Пример: Плейлист (рабочий)</option>
        <option value="https://music.yandex.ru/iframe/playlist/music-blog/1175">Пример: Громкие новинки (рабочий)</option>
        <option value="https://music.yandex.ru/iframe/track/43643085/5813591">Пример: Трек (рабочий)</option>
      </select>
    </div>
    <iframe 
      id="music-iframe"
      frameborder="0" 
      style="border:none; width:100%; height:180px;" 
      width="100%" 
      height="180" 
      src="https://music.yandex.ru/iframe/playlist/trj-voron/1004">
    </iframe>
  </div>

  <div class="grid" id="grid"></div>
</div>
<script>
// ... (остальной JavaScript-код без изменений) ...
</script>
</body>
</html>
