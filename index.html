<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<!-- 🛑 ЗАПРЕТ КЭШИРОВАНИЯ -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!-- ------------------- -->
<title>ZENIT · Главная</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: #0A0A1A; color: #fff; min-height: 100vh; }

.header { display: flex; align-items: center; gap: 12px; padding: 16px; background: #14142B; border-bottom: 1px solid rgba(0, 255, 255, 0.3); position: sticky; top: 0; z-index: 100; }
.logo-wrap { display: flex; align-items: center; gap: 12px; flex: 1; text-decoration: none; color: inherit; }
.logo-img { width: 44px; height: 44px; object-fit: contain; }
.logo-text h1 { font-size: 22px; font-weight: 900; letter-spacing: 1px; }
.logo-text p { font-size: 13px; color: #00FFFF; }
.header-btn { width: 44px; height: 44px; border-radius: 12px; background: #0A0A1A; border: 1px solid rgba(0, 255, 255, 0.5); color: #00FFFF; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: all 0.2s; }
.header-btn:hover { background: rgba(0, 255, 255, 0.15); }
.header-btn.pink { border-color: rgba(255, 0, 255, 0.5); color: #FF00FF; }
.header-btn.pink:hover { background: rgba(255, 0, 255, 0.15); }

.container { max-width: 1000px; margin: 0 auto; padding: 16px; } /* Чуть увеличили максимальную ширину контейнера */
.user-card { background: #14142B; border: 1px solid rgba(255, 0, 255, 0.5); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: #fff; transition: all 0.2s; }
.user-card:hover { background: rgba(255, 0, 255, 0.05); }
.user-name { font-size: 16px; font-weight: 700; }
.user-profile-link { font-size: 13px; color: #00FFFF; font-weight: bold; }

.search-bar { margin-bottom: 24px; }
.search-input { width: 100%; padding: 14px 18px; border-radius: 12px; background: #14142B; border: 1px solid rgba(0, 255, 255, 0.5); color: #fff; font-size: 15px; outline: none; transition: all 0.2s; }
.search-input:focus { border-color: #00FFFF; box-shadow: 0 0 12px rgba(0, 255, 255, 0.3); }

/* 📐 УВЕЛИЧЕННАЯ СЕТКА КАРТОЧЕК */
.grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); /* Было 160px, стало 220px */
    gap: 16px; 
}
.db-card { 
    background: #14142B; 
    border: 1px solid rgba(0, 255, 255, 0.5); 
    border-radius: 14px; 
    overflow: hidden; 
    text-decoration: none; 
    color: #fff; 
    display: flex; 
    flex-direction: column; 
    transition: all 0.2s; 
}
.db-card:hover { border-color: #00FFFF; box-shadow: 0 0 15px rgba(0, 255, 255, 0.2); transform: translateY(-2px); }

/* 📸 УВЕЛИЧЕННЫЙ БАННЕР */
.db-image { 
    width: 100%; 
    height: 200px; /* Было 140px, стало 200px */
    border-bottom: 1px solid rgba(0, 255, 255, 0.3); 
    position: relative; 
    background: #0A0A1A; 
}
.db-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
.db-image-placeholder { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: flex; align-items: center; justify-content: center; font-size: 56px; background: linear-gradient(135deg, rgba(255,0,255,0.4), rgba(0,255,255,0.4)); }

/* 🔤 УВЕЛИЧЕННЫЙ ТЕКСТ */
.db-title { 
    padding: 16px 12px; 
    font-size: 16px; /* Было 14px */
    font-weight: 700; 
    text-align: center; 
    flex-grow: 1;
    display: flex; 
    align-items: center; 
    justify-content: center;
}
.empty { text-align: center; padding: 60px 20px; color: #606060; grid-column: 1 / -1; }
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="logo-wrap">
    <img src="logo_zenit.png" alt="ZENIT" class="logo-img" onerror="this.style.display='none'">
    <div class="logo-text">
      <h1>ZENIT</h1>
      <p id="header-role">Гость</p>
    </div>
  </a>
  <a href="tasks.html" class="header-btn" title="Мой Чек-лист">✅</a>
  <button class="header-btn pink" onclick="logout()" title="Выйти">🚪</button>
</div>

<div class="container">
  <a href="#" id="profile-link" class="user-card">
    <div class="user-name" id="user-name">Гость</div>
    <div class="user-profile-link" id="profile-action">Войти →</div>
  </a>

  <div class="search-bar">
    <input type="text" class="search-input" id="search-input" placeholder="🔍 Поиск раздела...">
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
const ROLE_TITLES = {
  MANAGER: 'Менеджер', DEPUTY_DIRECTOR: 'Заместитель директора', DIRECTOR: 'Директор',
  TU: 'ТУ', OD: 'ОД', ID: 'ИД', MODERATOR_ZENIT: 'Модератор Zenit', LEAD_DEV_ZENIT: 'Ведущий разработчик Zenit'
};

const DB_ITEMS = [
  { name: 'Мой Чек-лист', image: 'https://raw.githubusercontent.com/skawarodka05/zenit-web/main/banner_tasks.jpg', link: 'tasks.html', emoji: '✅' },
  { name: 'База Документов', image: 'banner_docs.jpg', link: 'chat.html?db=База Документов', emoji: '📄' },
  { name: 'База Продуктов', image: 'banner_products.jpg', link: 'chat.html?db=База Продуктов', emoji: '🛒' },
  { name: 'База Оборудования', image: 'banner_equipment.jpg', link: 'chat.html?db=База Оборудования', emoji: '⚙️' },
  { name: 'База Человечков', image: 'banner_people.jpg', link: 'chat.html?db=База Человечков', emoji: '👥' },
  { name: 'База Контактов', image: 'banner_contacts.jpg', link: 'contacts.html', emoji: '📞' },
  { name: 'База АУП', image: 'banner_aup.jpg', link: 'chat.html?db=База АУП', emoji: '🏢' },
  { name: 'База Алхимии', image: 'banner_alchemy.jpg', link: 'chat.html?db=База Алхимии', emoji: '🧪' },
  { name: 'Почта дня', image: 'banner_mail.jpg', link: 'chat.html?db=Почта дня', emoji: '📧' },
  { name: 'База SAI Global', image: 'banner_sai.jpg', link: 'sai.html', emoji: '📊' },
  { name: 'Общение', image: 'banner_communication.jpg', link: 'messenger.html', emoji: '💬' },
  { name: 'Псевдо диск L', image: 'banner_disk_l.jpg', link: 'disk_l.html', emoji: '💾' },
  { name: 'База слэнга', image: 'banner_slang.jpg', link: 'slang.html', emoji: '📚' }
];

function getUser() {
    try {
        const raw = localStorage.getItem('zenit-user');
        if (!raw || raw === 'undefined') return null;
        return JSON.parse(raw);
    } catch(e) { return null; }
}

function drawGrid(items) {
    const grid = document.getElementById('grid');
    if (!grid) return;
    if (items.length === 0) {
        grid.innerHTML = '<div class="empty">Ничего не найдено</div>';
        return;
    }
    let html = '';
    items.forEach(item => {
        let imgHtml = item.image 
            ? `<div class="db-image"><img src="${item.image}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><div class="db-image-placeholder" style="display:none;">${item.emoji}</div></div>`
            : `<div class="db-image"><div class="db-image-placeholder">${item.emoji}</div></div>`;
        html += `<a href="${item.link}" class="db-card">${imgHtml}<div class="db-title">${item.name}</div></a>`;
    });
    grid.innerHTML = html;
}

document.addEventListener('DOMContentLoaded', () => {
    const user = getUser();
    const userNameEl = document.getElementById('user-name');
    const headerRoleEl = document.getElementById('header-role');
    const profileLink = document.getElementById('profile-link');
    const profileAction = document.getElementById('profile-action');

    if (user && user.name) {
        userNameEl.textContent = user.name;
        headerRoleEl.textContent = ROLE_TITLES[user.role] || user.role || 'Сотрудник';
        profileLink.href = 'profile.html';
        profileAction.textContent = 'Профиль →';
    } else {
        userNameEl.textContent = 'Гость';
        headerRoleEl.textContent = 'Требуется вход';
        profileLink.href = 'login.html';
        profileAction.textContent = 'Войти →';
    }

    drawGrid(DB_ITEMS);

    document.getElementById('search-input').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase().trim();
        const filtered = q ? DB_ITEMS.filter(i => i.name.toLowerCase().includes(q)) : DB_ITEMS;
        drawGrid(filtered);
    });
});

function logout() {
    if (confirm('Выйти из аккаунта?')) {
        localStorage.removeItem('zenit-user'); 
        location.href = 'login.html';
    }
}
</script>
</body>
</html>
