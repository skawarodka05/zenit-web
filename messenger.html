<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ZENIT · Общение</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
html, body { height: 100%; overflow: hidden; }
body { background: #0A0A1A; color: #fff; display: flex; flex-direction: column; }

.header {
  display: flex; align-items: center; gap: 12px;
  padding: 16px; background: #14142B;
  border-bottom: 1px solid rgba(0, 255, 255, 0.3);
  flex-shrink: 0;
}
.back-btn {
  width: 42px; height: 42px; border-radius: 12px;
  background: #0A0A1A; border: 1px solid rgba(0, 255, 255, 0.5);
  color: #00FFFF; font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.header-title { flex: 1; }
.header-title h1 { font-size: 18px; font-weight: 700; }
.header-title p { font-size: 12px; color: #00FFFF; margin-top: 2px; }

.search-bar {
  padding: 8px 16px; background: #14142B;
  border-bottom: 1px solid rgba(0, 255, 255, 0.2);
  flex-shrink: 0;
}
.search-bar input {
  width: 100%; padding: 10px 14px; border-radius: 10px;
  background: #0A0A1A; border: 1px solid rgba(0, 255, 255, 0.3);
  color: #fff; font-size: 13px; outline: none;
}
.search-bar input:focus { border-color: #00FFFF; }

#messages {
  flex: 1; overflow-y: auto;
  padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
}
#messages::-webkit-scrollbar { width: 6px; }
#messages::-webkit-scrollbar-thumb { background: #00FFFF; border-radius: 3px; }

/* Строка пузыря */
.bubble-row {
  display: flex; width: 100%; align-items: flex-end; gap: 8px;
}
.bubble-row.mine { justify-content: flex-end; }
.bubble-row.other { justify-content: flex-start; }

/* Аватарка */
.bubble-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, #FF00FF, #00FFFF);
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 15px; flex-shrink: 0;
  background-size: cover; background-position: center;
  overflow: hidden; cursor: pointer;
  transition: transform 0.15s;
  border: 1px solid rgba(0, 255, 255, 0.4);
}
.bubble-avatar:hover { transform: scale(1.08); }
.bubble-avatar img {
  width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
}

.bubble {
  max-width: 70%; padding: 10px 14px; border-radius: 16px;
  word-wrap: break-word;
}
.bubble.mine {
  background: rgba(0, 255, 255, 0.15);
  border: 1px solid rgba(0, 255, 255, 0.5);
  border-bottom-right-radius: 4px;
}
.bubble.other {
  background: #14142B;
  border: 1px solid rgba(255, 0, 255, 0.3);
  border-bottom-left-radius: 4px;
}
.bubble-author {
  font-size: 11px; font-weight: 700; margin-bottom: 4px;
  cursor: pointer;
}
.bubble.mine .bubble-author { color: #00FFFF; text-align: right; }
.bubble.other .bubble-author { color: #FF00FF; }
.bubble-author:hover { text-decoration: underline; }
.bubble-text { font-size: 14px; line-height: 1.4; }
.bubble-image {
  max-width: 100%; border-radius: 10px; margin-top: 6px;
  border: 1px solid rgba(255, 0, 255, 0.4);
  cursor: pointer; display: block;
}
.bubble-file {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px; background: rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(0, 255, 255, 0.4); border-radius: 8px;
  color: #00FFFF; font-size: 12px; text-decoration: none;
  margin-top: 6px;
}
.bubble-delete {
  background: transparent; border: none; color: #606060;
  cursor: pointer; font-size: 12px; margin-top: 4px; padding: 0;
}
.bubble.mine .bubble-delete { color: rgba(255, 255, 255, 0.5); }
.bubble.mine .bubble-delete:hover { color: #FF00FF; }

.empty {
  text-align: center; padding: 40px 20px; color: #606060;
  margin: auto;
}

.composer {
  display: flex; align-items: flex-end; gap: 8px;
  padding: 10px 12px 14px;
  background: #14142B;
  border-top: 1px solid rgba(0, 255, 255, 0.3);
  flex-shrink: 0;
}
.composer-btn {
  width: 44px; height: 44px; border-radius: 12px;
  background: transparent; border: 1px solid rgba(0, 255, 255, 0.4);
  color: #00FFFF; cursor: pointer; font-size: 20px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.composer-btn:hover { background: rgba(0, 255, 255, 0.1); }
.composer-btn.active { background: rgba(255, 0, 255, 0.15); border-color: #FF00FF; color: #FF00FF; }
.composer-input {
  flex: 1;
  padding: 12px 16px; border-radius: 22px;
  background: #0A0A1A; border: 1px solid rgba(0, 255, 255, 0.4);
  color: #fff; font-size: 14px; outline: none;
  font-family: inherit; resize: none;
  max-height: 120px; min-height: 44px;
  line-height: 1.4;
}
.composer-input:focus { border-color: #00FFFF; }
.composer-send {
  width: 48px; height: 48px; border-radius: 50%;
  background: linear-gradient(135deg, #FF00FF, #00FFFF);
  border: none; color: #fff; cursor: pointer; font-size: 20px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
}
.composer-send:disabled { opacity: 0.5; cursor: not-allowed; }

.attachments {
  display: flex; gap: 8px; padding: 0 12px 8px;
  flex-wrap: wrap;
}
.attachment {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px; background: #0A0A1A;
  border: 1px solid #FF00FF; border-radius: 20px;
  color: #FF00FF; font-size: 12px;
}
.attachment button {
  background: transparent; border: none; color: #FF00FF;
  cursor: pointer; font-size: 14px; padding: 0;
  margin-left: 4px;
}

#viewer {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95);
  display: none; align-items: center; justify-content: center; z-index: 1000;
}
#viewer img { max-width: 90%; max-height: 90%; }
#viewer .close {
  position: absolute; top: 20px; right: 20px;
  width: 48px; height: 48px; border-radius: 50%;
  background: rgba(255, 0, 255, 0.8); border: none;
  color: #fff; font-size: 24px; cursor: pointer;
}
</style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="location.href='index.html'">←</button>
  <div class="header-title">
    <h1>Общение</h1>
    <p id="info">Загрузка...</p>
  </div>
</div>

<div class="search-bar">
  <input type="text" id="search-input" placeholder="🔍 Поиск..." oninput="filterMessages()">
</div>

<div id="messages">
  <div class="empty">Загрузка...</div>
</div>

<div class="attachments" id="attachments" style="display:none;"></div>

<div class="composer">
  <button class="composer-btn" id="file-btn" onclick="document.getElementById('file-input').click()" title="Файл">📎</button>
  <button class="composer-btn" id="image-btn" onclick="document.getElementById('image-input').click()" title="Фото">🖼</button>
  <textarea class="composer-input" id="msg-input" placeholder="Сообщение..." rows="1"></textarea>
  <button class="composer-send" id="send-btn" onclick="sendMessage()">➤</button>
  <input type="file" id="file-input" style="display:none;" onchange="onFileSelected(this, 'file')">
  <input type="file" id="image-input" accept="image/*" style="display:none;" onchange="onFileSelected(this, 'image')">
</div>

<div id="viewer" onclick="this.style.display='none'">
  <button class="close" onclick="document.getElementById('viewer').style.display='none'">×</button>
  <img id="viewer-img" src="">
</div>

<script>
// ========== КОНФИГ ==========
const SB_URL = 'https://owkizfikhtiqbwftqgfd.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93a2l6ZmlraHRpcWJ3ZnRxZ2ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0OTYxMDYsImV4cCI6MjEwNzA3MjEwNn0.EHVyXiBYuSJrDVd_k5zAbwqT3ZPFF43p5Uh4_huKoOo';
window.SB = window.supabase.createClient(SB_URL, SB_KEY);

const DB_NAME = 'Общение';

let currentUser = JSON.parse(localStorage.getItem('zenit-user') || 'null');
let allMessages = [];
let selectedFile = null;
let selectedImage = null;

if (!currentUser) { location.href = 'index.html'; }

document.getElementById('info').textContent = currentUser.name + ' · ' + (currentUser.role || '');

// ========== ЗАГРУЗКА СООБЩЕНИЙ ==========
async function loadMessages() {
  try {
    const { data, error } = await window.SB
      .from('posts')
      .select('*')
      .eq('database_name', DB_NAME)
      .order('id', { ascending: true });

    if (error) throw error;

    allMessages = data || [];
    renderMessages(allMessages);
  } catch (e) {
    console.error(e);
    document.getElementById('messages').innerHTML = '<div class="empty">Ошибка: ' + e.message + '</div>';
  }
}

function renderMessages(msgs) {
  const container = document.getElementById('messages');

  if (!msgs || msgs.length === 0) {
    container.innerHTML = '<div class="empty">Пока нет сообщений</div>';
    return;
  }

  container.innerHTML = msgs.map(m => {
    const isMine = m.author === currentUser.name;
    const initial = m.author ? m.author.charAt(0).toUpperCase() : '?';
    const avatarUrl = m.author_avatar || '';
    const avatarInner = avatarUrl
      ? `<img src="${escapeAttr(avatarUrl)}" alt="">`
      : initial;
    const authorLink = `profile.html?user=${encodeURIComponent(m.author)}`;

    // Аватарка: у своих — справа, у чужих — слева
    const avatarHtml = `
      <div class="bubble-avatar" onclick="location.href='${authorLink}'" title="${escapeAttr(m.author)}">
        ${avatarInner}
      </div>
    `;

    return `
      <div class="bubble-row ${isMine ? 'mine' : 'other'}">
        ${!isMine ? avatarHtml : ''}
        <div class="bubble ${isMine ? 'mine' : 'other'}">
          <div class="bubble-author" onclick="location.href='${authorLink}'">${isMine ? 'Вы' : escapeHtml(m.author)}</div>
          <div class="bubble-text">${escapeHtml(m.content)}</div>
          ${m.image_url ? `<img class="bubble-image" src="${m.image_url}" onclick="viewImage('${m.image_url}')">` : ''}
          ${m.file_url ? `<a class="bubble-file" href="${m.file_url}" target="_blank">📎 Файл</a>` : ''}
          ${isMine ? `<button class="bubble-delete" onclick="deleteMessage(${m.id})">Удалить</button>` : ''}
        </div>
        ${isMine ? avatarHtml : ''}
      </div>
    `;
  }).join('');

  container.scrollTop = container.scrollHeight;
}

function filterMessages() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  if (!q) { renderMessages(allMessages); return; }
  const filtered = allMessages.filter(m =>
    (m.content || '').toLowerCase().includes(q) ||
    (m.author || '').toLowerCase().includes(q)
  );
  renderMessages(filtered);
}

// ========== ВЫБОР ВЛОЖЕНИЙ ==========
function onFileSelected(input, type) {
  const file = input.files[0];
  if (!file) return;

  if (type === 'file') {
    selectedFile = file;
    document.getElementById('file-btn').classList.add('active');
  } else {
    selectedImage = file;
    document.getElementById('image-btn').classList.add('active');
  }

  updateAttachmentsPreview();
  input.value = '';
}

function updateAttachmentsPreview() {
  const container = document.getElementById('attachments');
  const items = [];

  if (selectedFile) {
    items.push(`<div class="attachment">📎 ${escapeHtml(selectedFile.name.slice(0, 20))} <button onclick="clearAttachment('file')">×</button></div>`);
  }
  if (selectedImage) {
    items.push(`<div class="attachment">🖼 ${escapeHtml(selectedImage.name.slice(0, 20))} <button onclick="clearAttachment('image')">×</button></div>`);
  }

  if (items.length === 0) {
    container.style.display = 'none';
    container.innerHTML = '';
  } else {
    container.style.display = 'flex';
    container.innerHTML = items.join('');
  }
}

function clearAttachment(type) {
  if (type === 'file') {
    selectedFile = null;
    document.getElementById('file-btn').classList.remove('active');
  } else {
    selectedImage = null;
    document.getElementById('image-btn').classList.remove('active');
  }
  updateAttachmentsPreview();
}

// ========== ОТПРАВКА ==========
async function uploadFile(file, bucket) {
  const fileName = 'msg_' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  const { error } = await window.SB.storage.from(bucket).upload(fileName, file);
  if (error) throw error;
  const { data } = window.SB.storage.from(bucket).getPublicUrl(fileName);
  return data.publicUrl;
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const content = input.value.trim();

  if (!content && !selectedFile && !selectedImage) return;

  const btn = document.getElementById('send-btn');
  btn.disabled = true;

  try {
    let fileUrl = null, imageUrl = null;

    if (selectedFile) fileUrl = await uploadFile(selectedFile, 'attachments');
    if (selectedImage) imageUrl = await uploadFile(selectedImage, 'images');

    const { error } = await window.SB.from('posts').insert({
      database_name: DB_NAME,
      title: 'Сообщение',
      content: content || '📎 Вложение',
      author: currentUser.name,
      role: currentUser.role,
      author_avatar: currentUser.avatar_url || '',
      has_file: !!fileUrl,
      has_image: !!imageUrl,
      file_url: fileUrl,
      image_url: imageUrl,
    });

    if (error) throw error;

    input.value = '';
    input.style.height = 'auto';
    selectedFile = null;
    selectedImage = null;
    document.getElementById('file-btn').classList.remove('active');
    document.getElementById('image-btn').classList.remove('active');
    updateAttachmentsPreview();

    await loadMessages();
  } catch (e) {
    alert('Ошибка: ' + e.message);
    console.error(e);
  } finally {
    btn.disabled = false;
  }
}

// ========== УДАЛЕНИЕ ==========
async function deleteMessage(id) {
  if (!confirm('Удалить сообщение?')) return;
  const { error } = await window.SB.from('posts').delete().eq('id', id);
  if (error) { alert('Ошибка: ' + error.message); return; }
  loadMessages();
}

// ========== ПРОСМОТР КАРТИНКИ ==========
function viewImage(url) {
  document.getElementById('viewer-img').src = url;
  document.getElementById('viewer').style.display = 'flex';
}

// ========== УТИЛИТЫ ==========
function escapeHtml(text) {
  if (!text) return '';
  return String(text).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function escapeAttr(text) {
  if (!text) return '';
  return String(text).replace(/"/g, '&quot;').replace(/'/g, "\\'");
}

// ========== ОБРАБОТЧИКИ ==========
const msgInput = document.getElementById('msg-input');
msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
msgInput.addEventListener('input', () => {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
});

// ========== СТАРТ ==========
loadMessages();
setInterval(() => {
  if (!document.getElementById('search-input').value) loadMessages();
}, 5000);
</script>
</body>
</html>
