<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ZENIT · Профиль</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: #0A0A1A; color: #fff; min-height: 100vh; }
.hidden { display: none !important; }

/* Шапка */
.header {
  display: flex; align-items: center; gap: 12px;
  padding: 16px; background: #14142B;
  border-bottom: 1px solid rgba(0, 255, 255, 0.3);
  position: sticky; top: 0; z-index: 100;
}
.back-btn {
  width: 42px; height: 42px; border-radius: 12px;
  background: #0A0A1A; border: 1px solid rgba(0, 255, 255, 0.5);
  color: #00FFFF; font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.header-title h1 { font-size: 18px; font-weight: 700; }

/* Контейнер */
.container { max-width: 600px; margin: 0 auto; padding: 16px; }

/* ==================== ЧУЖОЙ ПРОФИЛЬ ==================== */
.other-banner {
  position: relative;
  height: 200px;
  overflow: hidden;
  background: linear-gradient(135deg, rgba(255,0,255,0.25), rgba(0,255,255,0.25));
  background-size: cover;
  background-position: center;
}
.other-banner-gradient {
  position: absolute; inset: auto 0 0 0; height: 100px;
  background: linear-gradient(to top, #0A0A1A, transparent);
}

.other-avatar-section {
  text-align: center; margin-top: -70px; position: relative;
}
.other-avatar-outer {
  width: 140px; height: 140px; border-radius: 50%; margin: 0 auto;
  background: #0A0A1A; padding: 4px;
}
.other-avatar {
  width: 100%; height: 100%; border-radius: 50%;
  background: linear-gradient(135deg, rgba(255,0,255,0.4), rgba(0,255,255,0.4));
  background-size: cover; background-position: center;
  display: flex; align-items: center; justify-content: center;
  font-size: 52px; font-weight: 900;
}
.other-name {
  font-size: 26px; font-weight: 800;
  margin-top: 12px; text-align: center;
}
.other-role-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 20px;
  background: rgba(255, 0, 255, 0.15);
  border: 1px solid rgba(255, 0, 255, 0.5);
  color: #FF00FF; font-size: 13px; font-weight: 700;
  margin: 12px 0 24px;
}

.other-bio {
  background: #14142B; border: 1px solid rgba(0, 255, 255, 0.3);
  border-radius: 12px; padding: 14px; margin-bottom: 20px;
}
.other-bio-label { font-size: 11px; color: #B0B0C0; margin-bottom: 6px; }
.other-bio-text { font-size: 14px; line-height: 1.5; }

.other-info {
  display: flex; align-items: center; gap: 12px;
  background: #14142B; border: 1px solid rgba(0, 255, 255, 0.3);
  border-radius: 12px; padding: 14px; margin-bottom: 10px;
}
.other-info-icon {
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(0, 255, 255, 0.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.other-info-label { font-size: 11px; color: #B0B0C0; }
.other-info-value { font-size: 15px; font-weight: 700; }

/* ==================== СВОЙ ПРОФИЛЬ ==================== */
.banner-wrapper {
  position: relative;
  height: 200px;
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 20px;
  background: linear-gradient(135deg, #FF00FF40, #00FFFF40);
  background-size: cover;
  background-position: center;
  border: 1px solid rgba(0, 255, 255, 0.3);
  cursor: pointer;
  transition: all 0.2s;
}
.banner-wrapper:hover { box-shadow: 0 0 20px rgba(0, 255, 255, 0.4); }

.banner-overlay {
  position: absolute; inset: 0;
  background: rgba(0, 0, 0, 0.4);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.2s;
  color: #fff;
}
.banner-wrapper:hover .banner-overlay { opacity: 1; }
.banner-overlay-icon { font-size: 36px; margin-bottom: 8px; }
.banner-overlay-text { font-size: 14px; font-weight: 700; }

.avatar-section {
  display: flex; justify-content: center;
  margin-top: -80px; margin-bottom: 20px;
  position: relative; z-index: 2;
}
.avatar-wrapper {
  position: relative;
  width: 140px; height: 140px;
  cursor: pointer;
}
.avatar-img {
  width: 140px; height: 140px;
  border-radius: 50%;
  border: 4px solid #0A0A1A;
  background: linear-gradient(135deg, #FF00FF, #00FFFF);
  background-size: cover;
  background-position: center;
  display: flex; align-items: center; justify-content: center;
  font-size: 56px; font-weight: 900;
  overflow: hidden;
  transition: all 0.2s;
}
.avatar-wrapper:hover .avatar-img {
  box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
}
.avatar-overlay {
  position: absolute; inset: 0;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.6);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.2s;
  font-size: 36px;
}
.avatar-wrapper:hover .avatar-overlay { opacity: 1; }

.form-group { margin-bottom: 16px; }
.form-label {
  display: block; font-size: 12px; color: #B0B0C0;
  margin-bottom: 6px; font-weight: 600;
}
.form-input, .form-textarea {
  width: 100%; padding: 14px 16px; border-radius: 12px;
  background: #14142B; border: 1px solid rgba(0, 255, 255, 0.4);
  color: #fff; font-size: 15px; outline: none;
  font-family: inherit; transition: all 0.2s;
}
.form-input:focus, .form-textarea:focus {
  border-color: #00FFFF;
  box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
}
.form-input::placeholder, .form-textarea::placeholder { color: #606060; }
.form-textarea { min-height: 100px; resize: vertical; }
.form-input:disabled { background: #0A0A1A; color: #606060; cursor: not-allowed; }

.save-btn {
  width: 100%; padding: 16px; border: none; border-radius: 14px;
  background: linear-gradient(90deg, #FF00FF, #00FFFF);
  color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
  box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
  transition: all 0.2s; margin-top: 20px;
}
.save-btn:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0, 255, 255, 0.6); }
.save-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.toast {
  position: fixed; bottom: 30px; left: 50%;
  transform: translateX(-50%) translateY(100px);
  padding: 14px 24px; background: #00FFFF; color: #0A0A1A;
  font-weight: 700; border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0, 255, 255, 0.5);
  transition: transform 0.3s; z-index: 1000;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.error { background: #FF00FF; color: #fff; }

.loading {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7);
  display: none; align-items: center; justify-content: center;
  z-index: 999; color: #00FFFF; font-size: 16px; font-weight: 700;
}
.loading.show { display: flex; }

.spinner {
  width: 50px; height: 50px;
  border: 4px solid rgba(0, 255, 255, 0.2);
  border-top-color: #00FFFF;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.role-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px;
  background: rgba(255, 0, 255, 0.15);
  border: 1px solid rgba(255, 0, 255, 0.5);
  border-radius: 20px;
  font-size: 13px; font-weight: 700; color: #FF00FF;
  margin-bottom: 24px;
}

.logout-btn {
  width: 100%; padding: 16px;
  background: transparent; border: 1px solid #FF00FF;
  color: #FF00FF; border-radius: 14px;
  font-size: 15px; font-weight: 700; cursor: pointer;
  margin-top: 24px; transition: all 0.2s;
}
.logout-btn:hover { background: rgba(255, 0, 255, 0.15); }
</style>
</head>
<body>

<!-- Шапка -->
<div class="header">
  <button class="back-btn" onclick="history.back()">←</button>
  <div class="header-title">
    <h1 id="page-title">Профиль</h1>
  </div>
</div>

<!-- ==================== ЧУЖОЙ ПРОФИЛЬ ==================== -->
<div id="other-profile" style="display:none;">
  <div class="other-banner" id="other-banner">
    <div class="other-banner-gradient"></div>
  </div>

  <div class="other-avatar-section">
    <div class="other-avatar-outer">
      <div class="other-avatar" id="other-avatar">?</div>
    </div>
  </div>

  <div class="container">
    <div class="other-name" id="other-name">Загрузка...</div>
    <div style="text-align:center;">
      <div class="other-role-chip" id="other-role">🛡 —</div>
    </div>

    <div class="other-bio">
      <div class="other-bio-label">О себе</div>
      <div class="other-bio-text" id="other-bio">—</div>
    </div>

    <div class="other-info">
      <div class="other-info-icon">👤</div>
      <div>
        <div class="other-info-label">Имя</div>
        <div class="other-info-value" id="other-name-info">—</div>
      </div>
    </div>

    <div class="other-info">
      <div class="other-info-icon">🛡</div>
      <div>
        <div class="other-info-label">Роль</div>
        <div class="other-info-value" id="other-role-info">—</div>
      </div>
    </div>

    <div class="other-info">
      <div class="other-info-icon">✉</div>
      <div>
        <div class="other-info-label">Email</div>
        <div class="other-info-value" id="other-email-info">—</div>
      </div>
    </div>
  </div>
</div>

<!-- ==================== СВОЙ ПРОФИЛЬ ==================== -->
<div class="container" id="my-profile">
  <div class="banner-wrapper" id="banner-wrapper" onclick="document.getElementById('banner-input').click()">
    <div class="banner-overlay">
      <div class="banner-overlay-icon">🖼</div>
      <div class="banner-overlay-text">Сменить баннер</div>
    </div>
  </div>

  <div class="avatar-section">
    <div class="avatar-wrapper" onclick="document.getElementById('avatar-input').click()">
      <div class="avatar-img" id="avatar-img">?</div>
      <div class="avatar-overlay">📷</div>
    </div>
  </div>

  <div style="text-align: center;">
    <div class="role-badge" id="role-badge">🛡 Роль</div>
  </div>

  <div class="form-group">
    <label class="form-label">Имя</label>
    <input type="text" class="form-input" id="name-input" placeholder="Ваше имя">
  </div>

  <div class="form-group">
    <label class="form-label">Email</label>
    <input type="text" class="form-input" id="email-input" disabled>
  </div>

  <div class="form-group">
    <label class="form-label">О себе</label>
    <textarea class="form-textarea" id="description-input" placeholder="Например: Инженер, люблю футбол"></textarea>
  </div>

  <button class="save-btn" id="save-btn" onclick="saveProfile()">Сохранить</button>
  <button class="logout-btn" onclick="logout()">Выйти из аккаунта</button>
</div>

<input type="file" id="avatar-input" accept="image/*" style="display:none;" onchange="onAvatarSelected(this)">
<input type="file" id="banner-input" accept="image/*" style="display:none;" onchange="onBannerSelected(this)">

<div class="loading" id="loading">
  <div class="spinner"></div>
  <span id="loading-text">Загрузка...</span>
</div>

<div class="toast" id="toast">Сохранено</div>

<script>
// ========== КОНФИГ ==========
const SB_URL = 'https://owkizfikhtiqbwftqgfd.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93a2l6ZmlraHRpcWJ3ZnRxZ2ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0OTYxMDYsImV4cCI6MjEwNzA3MjEwNn0.EHVyXiBYuSJrDVd_k5zAbwqT3ZPFF43p5Uh4_huKoOo';
window.SB = window.supabase.createClient(SB_URL, SB_KEY);

const ROLE_TITLES = {
  MANAGER: 'Менеджер',
  DEPUTY_DIRECTOR: 'Заместитель директора',
  DIRECTOR: 'Директор',
  TU: 'ТУ', OD: 'ОД', ID: 'ИД',
  MODERATOR_ZENIT: 'Модератор Zenit',
  LEAD_DEV_ZENIT: 'Ведущий разработчик Zenit'
};

let currentUser = JSON.parse(localStorage.getItem('zenit-user') || 'null');
if (!currentUser) location.href = 'index.html';

let newAvatarFile = null;
let newBannerFile = null;

// ========== ОПРЕДЕЛЯЕМ РЕЖИМ ==========
const urlUser = new URLSearchParams(location.search).get('user');

if (urlUser) {
  // ЧУЖОЙ ПРОФИЛЬ
  document.getElementById('my-profile').style.display = 'none';
  document.getElementById('other-profile').style.display = 'block';
  document.getElementById('page-title').textContent = 'Профиль · ' + urlUser;
  loadOtherProfile(urlUser);
} else {
  // СВОЙ ПРОФИЛЬ
  document.getElementById('my-profile').style.display = 'block';
  document.getElementById('other-profile').style.display = 'none';
  document.getElementById('page-title').textContent = 'Мой профиль';
  initMyProfile();
}

// ==================== ЧУЖОЙ ПРОФИЛЬ ====================
async function loadOtherProfile(name) {
  try {
    const { data, error } = await window.SB
      .from('users')
      .select('*')
      .eq('name', name)
      .limit(1);

    if (error) throw error;

    if (!data || data.length === 0) {
      document.getElementById('other-name').textContent = 'Пользователь не найден';
      return;
    }

    const u = data[0];

    document.getElementById('other-name').textContent = u.name || 'Гость';
    document.getElementById('other-role').textContent = '🛡 ' + (ROLE_TITLES[u.role] || u.role);
    document.getElementById('other-bio').textContent = u.description || 'Пользователь пока не добавил описание';
    document.getElementById('other-name-info').textContent = u.name || '—';
    document.getElementById('other-role-info').textContent = ROLE_TITLES[u.role] || u.role;
    document.getElementById('other-email-info').textContent = u.email || '—';

    // Баннер
    if (u.banner_url) {
      document.getElementById('other-banner').style.backgroundImage = `url('${u.banner_url}')`;
    }

    // Аватар
    const av = document.getElementById('other-avatar');
    if (u.avatar_url) {
      av.style.backgroundImage = `url('${u.avatar_url}')`;
      av.textContent = '';
    } else {
      av.textContent = (u.name || '?').charAt(0).toUpperCase();
    }
  } catch (e) {
    console.error(e);
    document.getElementById('other-name').textContent = 'Ошибка загрузки';
  }
}

// ==================== СВОЙ ПРОФИЛЬ ====================
function initMyProfile() {
  document.getElementById('name-input').value = currentUser.name || '';
  document.getElementById('email-input').value = currentUser.email || '';
  document.getElementById('description-input').value = currentUser.description || '';
  document.getElementById('role-badge').innerHTML = '🛡 ' + (ROLE_TITLES[currentUser.role] || currentUser.role);

  updateAvatar(currentUser.avatar_url, currentUser.name);
  updateBanner(currentUser.banner_url);
}

function updateAvatar(url, name) {
  const el = document.getElementById('avatar-img');
  if (url) {
    el.style.backgroundImage = `url('${url}')`;
    el.textContent = '';
  } else {
    el.style.backgroundImage = 'linear-gradient(135deg, #FF00FF, #00FFFF)';
    el.textContent = (name || '?').charAt(0).toUpperCase();
  }
}

function updateBanner(url) {
  const el = document.getElementById('banner-wrapper');
  if (url) {
    el.style.backgroundImage = `url('${url}')`;
  } else {
    el.style.backgroundImage = 'linear-gradient(135deg, #FF00FF40, #00FFFF40)';
  }
}

function onAvatarSelected(input) {
  const file = input.files[0];
  if (!file) return;
  newAvatarFile = file;

  const reader = new FileReader();
  reader.onload = (e) => {
    document.getElementById('avatar-img').style.backgroundImage = `url('${e.target.result}')`;
    document.getElementById('avatar-img').textContent = '';
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function onBannerSelected(input) {
  const file = input.files[0];
  if (!file) return;
  newBannerFile = file;

  const reader = new FileReader();
  reader.onload = (e) => {
    document.getElementById('banner-wrapper').style.backgroundImage = `url('${e.target.result}')`;
  };
  reader.readAsDataURL(file);
  input.value = '';
}

async function uploadFile(file, bucket) {
  const fileName = bucket + '_' + currentUser.email.replace(/[^a-z0-9]/gi, '_') + '_' + Date.now() + '.jpg';
  const { error } = await window.SB.storage.from(bucket).upload(fileName, file, { upsert: true });
  if (error) throw error;
  const { data } = window.SB.storage.from(bucket).getPublicUrl(fileName);
  return data.publicUrl;
}

async function saveProfile() {
  const name = document.getElementById('name-input').value.trim();
  const description = document.getElementById('description-input').value.trim();

  if (!name) { showToast('Введите имя', true); return; }

  const btn = document.getElementById('save-btn');
  btn.disabled = true;

  try {
    let avatarUrl = currentUser.avatar_url || '';
    let bannerUrl = currentUser.banner_url || '';

    if (newAvatarFile) {
      showLoading('Загрузка аватара...');
      avatarUrl = await uploadFile(newAvatarFile, 'avatars');
    }

    if (newBannerFile) {
      showLoading('Загрузка баннера...');
      bannerUrl = await uploadFile(newBannerFile, 'banners');
    }

    showLoading('Сохранение...');
    const { error } = await window.SB.from('users').update({
      name: name,
      description: description,
      avatar_url: avatarUrl,
      banner_url: bannerUrl,
    }).eq('email', currentUser.email);

    if (error) throw error;

    currentUser.name = name;
    currentUser.description = description;
    currentUser.avatar_url = avatarUrl;
    currentUser.banner_url = bannerUrl;
    localStorage.setItem('zenit-user', JSON.stringify(currentUser));

    newAvatarFile = null;
    newBannerFile = null;

    hideLoading();
    showToast('✅ Профиль обновлён!');

    updateAvatar(avatarUrl, name);
    updateBanner(bannerUrl);
  } catch (e) {
    hideLoading();
    showToast('Ошибка: ' + e.message, true);
    console.error(e);
  } finally {
    btn.disabled = false;
  }
}

function logout() {
  if (!confirm('Выйти из аккаунта?')) return;
  localStorage.removeItem('zenit-user');
  location.href = 'index.html';
}

function showToast(text, isError = false) {
  const toast = document.getElementById('toast');
  toast.textContent = text;
  toast.classList.toggle('error', isError);
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function showLoading(text) {
  document.getElementById('loading-text').textContent = text;
  document.getElementById('loading').classList.add('show');
}
function hideLoading() {
  document.getElementById('loading').classList.remove('show');
}
</script>
</body>
</html>
