<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="icon" type="image/png" href="logo_zenit.png">
<title>ZENIT · Мой Задачник</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: #0A0A1A; color: #fff; min-height: 100vh; padding-bottom: 80px; }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb { background: #00FFFF; border-radius: 4px; }

.header { display: flex; align-items: center; gap: 12px; padding: 16px; background: #14142B; border-bottom: 1px solid rgba(0, 255, 255, 0.3); position: sticky; top: 0; z-index: 100; }
.back-btn { width: 42px; height: 42px; border-radius: 12px; background: #0A0A1A; border: 1px solid rgba(0, 255, 255, 0.5); color: #00FFFF; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.header-title { flex: 1; }
.header-title h1 { font-size: 20px; font-weight: 700; }
.header-title p { font-size: 13px; color: #00FFFF; margin-top: 2px; }

.container { max-width: 900px; margin: 0 auto; padding: 16px; }

.filters { display: flex; gap: 8px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 4px; }
.filter-chip { padding: 10px 20px; border-radius: 20px; background: #14142B; border: 1px solid rgba(0, 255, 255, 0.4); color: #B0B0C0; cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap; transition: all 0.2s; }
.filter-chip.active { background: rgba(255, 0, 255, 0.15); border-color: #FF00FF; color: #FF00FF; }

.task-list { display: flex; flex-direction: column; gap: 12px; }
.task-card { display: flex; flex-direction: column; background: #14142B; border: 1px solid rgba(0, 255, 255, 0.3); border-radius: 14px; padding: 16px; transition: all 0.2s; }
.task-card:hover { border-color: rgba(0, 255, 255, 0.6); }
.task-card.done { opacity: 0.6; border-color: rgba(0, 255, 255, 0.1); background: #0d0d20; }
.task-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
.task-title { font-size: 17px; font-weight: 700; flex: 1; cursor: pointer; transition: color 0.2s; }
.task-title:hover { color: #00FFFF; }
.task-card.done .task-title { text-decoration: line-through; color: #606060; }

.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
.badge.status-todo { background: rgba(176, 176, 192, 0.15); color: #B0B0C0; }
.badge.status-in_progress { background: rgba(0, 255, 255, 0.15); color: #00FFFF; border: 1px solid rgba(0, 255, 255, 0.3); }
.badge.status-done { background: rgba(0, 255, 136, 0.15); color: #00FF88; }
.badge.priority-high { background: rgba(255, 68, 68, 0.15); color: #FF4444; }
.badge.priority-medium { background: rgba(255, 215, 0, 0.15); color: #FFD700; }
.badge.priority-low { background: rgba(0, 255, 136, 0.15); color: #00FF88; }
.badge.due-date { background: #0A0A1A; color: #B0B0C0; border: 1px solid rgba(255,255,255,0.1); }
.badge.due-date.overdue { color: #FF4444; border-color: rgba(255, 68, 68, 0.5); }

.task-desc { font-size: 14px; color: #B0B0C0; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.subtasks-preview { font-size: 12px; color: #00FFFF; display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-weight: 600; }
.progress-bar { width: 100%; height: 6px; background: #0A0A1A; border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #FF00FF, #00FFFF); border-radius: 3px; transition: width 0.3s; }

.task-actions { display: flex; gap: 8px; margin-top: auto; border-top: 1px solid rgba(0, 255, 255, 0.1); padding-top: 12px; }
.action-btn { padding: 6px 12px; border-radius: 8px; background: transparent; border: 1px solid rgba(0, 255, 255, 0.3); color: #00FFFF; font-size: 12px; cursor: pointer; transition: all 0.2s; font-weight: 600; }
.action-btn:hover { background: rgba(0, 255, 255, 0.1); }
.action-btn.delete { border-color: rgba(255, 0, 255, 0.3); color: #FF00FF; }
.action-btn.delete:hover { background: rgba(255, 0, 255, 0.1); }

.fab { position: fixed; bottom: 24px; right: 24px; padding: 16px 24px; border: none; border-radius: 50px; background: linear-gradient(90deg, #FF00FF, #00FFFF); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(0, 255, 255, 0.5); display: flex; align-items: center; gap: 8px; transition: all 0.2s; }
.fab:hover { transform: translateY(-3px); box-shadow: 0 0 35px rgba(0, 255, 255, 0.7); }

.modal-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; backdrop-filter: blur(4px); }
.modal-bg.show { display: flex; }
.modal { background: #14142B; border: 1px solid rgba(0, 255, 255, 0.4); border-radius: 16px; padding: 24px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
.modal-title { font-size: 20px; font-weight: 800; margin-bottom: 20px; color: #00FFFF; display: flex; justify-content: space-between; align-items: center; }
.close-btn { background: none; border: none; color: #FF00FF; font-size: 24px; cursor: pointer; }

.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 12px; color: #B0B0C0; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.form-input, .form-select, .form-textarea { width: 100%; padding: 12px 14px; border-radius: 10px; background: #0A0A1A; border: 1px solid rgba(0, 255, 255, 0.4); color: #fff; font-size: 14px; outline: none; font-family: inherit; }
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: #00FFFF; box-shadow: 0 0 10px rgba(0, 255, 255, 0.2); }
.form-row { display: flex; gap: 12px; }
.form-row > div { flex: 1; }

.subtask-list { margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
.subtask-item { display: flex; align-items: center; gap: 10px; background: #0A0A1A; padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(0, 255, 255, 0.2); }
.subtask-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: #00FFFF; cursor: pointer; }
.subtask-item input[type="text"] { flex: 1; background: none; border: none; color: #fff; font-size: 14px; outline: none; }
.subtask-item input[type="text"]:focus { border-bottom: 1px solid #00FFFF; }
.subtask-item button { background: none; border: none; color: #FF00FF; cursor: pointer; font-size: 16px; }
.add-subtask-btn { background: transparent; border: 1px dashed #00FFFF; color: #00FFFF; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.2s; }
.add-subtask-btn:hover { background: rgba(0, 255, 255, 0.1); }

.modal-actions { display: flex; gap: 12px; margin-top: 24px; }
.modal-btn { flex: 1; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; border: none; transition: all 0.2s; }
.modal-btn.save { background: linear-gradient(90deg, #FF00FF, #00FFFF); color: #fff; }
.modal-btn.save:hover { transform: translateY(-2px); box-shadow: 0 0 15px rgba(0, 255, 255, 0.4); }
.modal-btn.cancel { background: transparent; border: 1px solid #606060; color: #B0B0C0; }
.modal-btn.cancel:hover { background: rgba(255, 255, 255, 0.05); }

.empty { text-align: center; padding: 60px 20px; color: #606060; }

/* 🔔 УВЕДОМЛЕНИЯ И КАСТОМНЫЕ ОКНА */
#toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
.toast { background: #14142B; color: #fff; padding: 16px 20px; border-radius: 12px; border-left: 4px solid #00FFFF; box-shadow: 0 5px 15px rgba(0,0,0,0.5); font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; transform: translateX(120%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.toast.show { transform: translateX(0); }
.toast.error { border-left-color: #FF00FF; }

#confirm-modal { position: fixed; inset: 0; background: rgba(10, 10, 26, 0.8); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 10000; opacity: 0; transition: opacity 0.2s; }
#confirm-modal.show { display: flex; opacity: 1; }
.confirm-box { background: #14142B; border: 1px solid #FF00FF; border-radius: 16px; padding: 24px; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 0 30px rgba(255, 0, 255, 0.15); transform: scale(0.9); transition: transform 0.2s; }
#confirm-modal.show .confirm-box { transform: scale(1); }
.confirm-title { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 10px; }
.confirm-text { font-size: 14px; color: #B0B0C0; margin-bottom: 24px; line-height: 1.5; }
.confirm-actions { display: flex; gap: 10px; }
.confirm-btn { flex: 1; padding: 14px; border-radius: 12px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
.confirm-btn.cancel { background: transparent; border: 1px solid #606060; color: #B0B0C0; }
.confirm-btn.cancel:hover { background: rgba(255, 255, 255, 0.05); }
.confirm-btn.danger { background: rgba(255, 0, 255, 0.15); border: 1px solid #FF00FF; color: #FF00FF; }
.confirm-btn.danger:hover { background: rgba(255, 0, 255, 0.25); box-shadow: 0 0 15px rgba(255, 0, 255, 0.4); }
</style>
</head>
<body>

<div id="toast-container"></div>
<div id="confirm-modal">
    <div class="confirm-box">
        <div class="confirm-title" id="confirm-title">Вы уверены?</div>
        <div class="confirm-text" id="confirm-text">Это действие нельзя отменить.</div>
        <div class="confirm-actions">
            <button class="confirm-btn cancel" onclick="closeConfirm()">Отмена</button>
            <button class="confirm-btn danger" id="confirm-yes-btn">Подтвердить</button>
        </div>
    </div>
</div>

<div class="header">
  <button class="back-btn" onclick="location.href='index.html'">←</button>
  <div class="header-title">
    <h1>Мой Задачник</h1>
    <p id="subtitle">Загрузка...</p>
  </div>
</div>

<div class="container">
  <div class="filters" id="filters">
    <div class="filter-chip active" onclick="setFilter('all')">Все активные</div>
    <div class="filter-chip" onclick="setFilter('todo')">В планах</div>
    <div class="filter-chip" onclick="setFilter('in_progress')">В работе</div>
    <div class="filter-chip" onclick="setFilter('done')">Выполненные</div>
  </div>

  <div class="task-list" id="task-list">
    <div class="empty">Загрузка...</div>
  </div>
</div>

<button class="fab" onclick="openModal()">
  ➕ Новая задача
</button>

<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-title">
      <span id="modal-title-text">Новая задача</span>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>
    <input type="hidden" id="task-id">
    <div class="form-group">
      <label class="form-label">Название задачи *</label>
      <input type="text" class="form-input" id="task-title" placeholder="Например: Подготовить отчет">
    </div>
    <div class="form-group">
      <label class="form-label">Описание</label>
      <textarea class="form-textarea" id="task-desc" placeholder="Детали задачи..." rows="3"></textarea>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label class="form-label">Статус</label>
            <select class="form-select" id="task-status">
                <option value="todo">В планах</option>
                <option value="in_progress">В работе</option>
                <option value="done">Готово</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Приоритет</label>
            <select class="form-select" id="task-priority">
                <option value="low">🟢 Низкий</option>
                <option value="medium" selected>🟡 Средний</option>
                <option value="high">🔴 Высокий</option>
            </select>
        </div>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label class="form-label">Срок сдачи</label>
            <input type="date" class="form-input" id="task-due-date">
        </div>
    </div>
    <div class="form-group">
      <label class="form-label">Подзадачи (Чек-лист)</label>
      <div class="subtask-list" id="subtask-list"></div>
      <button class="add-subtask-btn" onclick="addSubtaskField()">+ Добавить подзадачу</button>
    </div>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeModal()">Отмена</button>
      <button class="modal-btn save" onclick="saveTask()">Сохранить</button>
    </div>
  </div>
</div>

<script>
const SB_URL = 'https://owkizfikhtiqbwftqgfd.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93a2l6ZmlraHRpcWJ3ZnRxZ2ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0OTYxMDYsImV4cCI6MjEwNzA3MjEwNn0.EHVyXiBYuSJrDVd_k5zAbwqT3ZPFF43p5Uh4_huKoOo';
window.SB = window.supabase.createClient(SB_URL, SB_KEY);

let currentUser = JSON.parse(localStorage.getItem('zenit-user') || 'null');
if (!currentUser) { location.href = 'login.html'; }
document.getElementById('subtitle').textContent = currentUser.name;

let allTasks = [];
let currentFilter = 'all';
let modalSubtasks = []; 

// 🔔 УВЕДОМЛЕНИЯ
function showToast(message, isError = false) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast' + (isError ? ' error' : '');
    toast.innerHTML = `<span>${isError ? '❌' : '✅'}</span> <span>${message}</span>`;
    container.appendChild(toast);
    setTimeout(() => toast.classList.add('show'), 10);
    setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

// ⚠️ ПОДТВЕРЖДЕНИЯ
let confirmCallback = null;
function showConfirm(title, text, onConfirm, btnText = 'Подтвердить') {
    document.getElementById('confirm-title').textContent = title;
    document.getElementById('confirm-text').textContent = text;
    const btn = document.getElementById('confirm-yes-btn');
    btn.textContent = btnText;
    confirmCallback = onConfirm;
    btn.onclick = () => { closeConfirm(); if(confirmCallback) confirmCallback(); };
    document.getElementById('confirm-modal').classList.add('show');
}
function closeConfirm() {
    document.getElementById('confirm-modal').classList.remove('show');
    confirmCallback = null;
}

// ========== ЗАГРУЗКА ==========
async function loadTasks() {
  try {
    const { data, error } = await window.SB.from('tasks').select('*').eq('user_email', currentUser.email).order('created_at', { ascending: false });
    if (error) throw error;
    allTasks = data || [];
    renderTasks();
  } catch (e) {
    document.getElementById('task-list').innerHTML = '<div class="empty">Ошибка: ' + e.message + '</div>';
  }
}

function setFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('.filter-chip').forEach(el => {
    const text = el.textContent.trim();
    if (filter === 'all') el.classList.toggle('active', text === 'Все активные');
    if (filter === 'todo') el.classList.toggle('active', text === 'В планах');
    if (filter === 'in_progress') el.classList.toggle('active', text === 'В работе');
    if (filter === 'done') el.classList.toggle('active', text === 'Выполненные');
  });
  renderTasks();
}

function renderTasks() {
  let filtered = allTasks;
  if (currentFilter === 'all') { filtered = filtered.filter(t => t.status !== 'done'); } 
  else { filtered = filtered.filter(t => t.status === currentFilter); }

  const container = document.getElementById('task-list');
  if (filtered.length === 0) { container.innerHTML = `<div class="empty">Задач нет 🎉</div>`; return; }

  container.innerHTML = filtered.map(t => {
    let statusText = 'В планах'; let statusClass = 'status-todo';
    if (t.status === 'in_progress') { statusText = 'В работе'; statusClass = 'status-in_progress'; }
    if (t.status === 'done') { statusText = 'Готово'; statusClass = 'status-done'; }

    let pText = 'Средний'; let pClass = 'priority-medium';
    if (t.priority === 'high') { pText = 'Высокий'; pClass = 'priority-high'; }
    if (t.priority === 'low') { pText = 'Низкий'; pClass = 'priority-low'; }

    let dueDateHtml = '';
    if (t.due_date) {
        const today = new Date().setHours(0,0,0,0);
        const due = new Date(t.due_date).setHours(0,0,0,0);
        const isOverdue = due < today && t.status !== 'done';
        const d = new Date(t.due_date);
        const formattedDate = `${d.getDate().toString().padStart(2, '0')}.${(d.getMonth()+1).toString().padStart(2, '0')}.${d.getFullYear()}`;
        dueDateHtml = `<span class="badge due-date ${isOverdue ? 'overdue' : ''}">📅 ${formattedDate} ${isOverdue ? '(Просрочено)' : ''}</span>`;
    }

    let subtasksHtml = ''; let progressHtml = '';
    if (t.subtasks && Array.isArray(t.subtasks) && t.subtasks.length > 0) {
        const doneCount = t.subtasks.filter(st => st.done).length;
        const total = t.subtasks.length;
        const percent = Math.round((doneCount / total) * 100);
        subtasksHtml = `<div class="subtasks-preview">☑️ Выполнено подзадач: ${doneCount} из ${total}</div>`;
        progressHtml = `<div class="progress-bar"><div class="progress-fill" style="width: ${percent}%"></div></div>`;
    }

    return `
      <div class="task-card ${t.status === 'done' ? 'done' : ''}">
        <div class="task-header">
            <div class="task-title" onclick="openModal(${t.id})">${escapeHtml(t.title)}</div>
        </div>
        <div class="badges">
            <span class="badge ${statusClass}">${statusText}</span>
            <span class="badge ${pClass}">${pText}</span>
            ${dueDateHtml}
        </div>
        ${t.description ? `<div class="task-desc">${escapeHtml(t.description)}</div>` : ''}
        ${progressHtml}
        ${subtasksHtml}
        <div class="task-actions">
            <button class="action-btn" onclick="quickStatus(${t.id}, '${t.status}')">
                ${t.status === 'done' ? '↩️ Вернуть в работу' : '✅ Завершить'}
            </button>
            <button class="action-btn delete" onclick="askDeleteTask(${t.id})">🗑 Удалить</button>
        </div>
      </div>
    `;
  }).join('');
}

// ========== ДЕЙСТВИЯ ==========
async function quickStatus(id, currentStatus) {
  const newStatus = currentStatus === 'done' ? 'todo' : 'done';
  await window.SB.from('tasks').update({ status: newStatus }).eq('id', id);
  loadTasks();
}

function askDeleteTask(id) {
    showConfirm(
        'Удалить задачу?', 
        'Восстановить её будет невозможно.', 
        async () => {
            await window.SB.from('tasks').delete().eq('id', id);
            showToast('Задача удалена');
            loadTasks();
        },
        'Удалить'
    );
}

// ========== МОДАЛКА ==========
function openModal(editId = null) {
  modalSubtasks = [];
  document.getElementById('task-id').value = '';
  document.getElementById('task-title').value = '';
  document.getElementById('task-desc').value = '';
  document.getElementById('task-status').value = 'todo';
  document.getElementById('task-priority').value = 'medium';
  document.getElementById('task-due-date').value = '';
  document.getElementById('modal-title-text').textContent = 'Новая задача';

  if (editId) {
      const task = allTasks.find(t => t.id === editId);
      if (task) {
          document.getElementById('modal-title-text').textContent = 'Редактировать задачу';
          document.getElementById('task-id').value = task.id;
          document.getElementById('task-title').value = task.title;
          document.getElementById('task-desc').value = task.description || '';
          document.getElementById('task-status').value = task.status || 'todo';
          document.getElementById('task-priority').value = task.priority || 'medium';
          document.getElementById('task-due-date').value = task.due_date || '';
          if (task.subtasks && Array.isArray(task.subtasks)) {
              modalSubtasks = JSON.parse(JSON.stringify(task.subtasks)); 
          }
      }
  }
  renderModalSubtasks();
  document.getElementById('modal').classList.add('show');
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }

function renderModalSubtasks() {
    const container = document.getElementById('subtask-list');
    container.innerHTML = modalSubtasks.map((st, index) => `
        <div class="subtask-item">
            <input type="checkbox" ${st.done ? 'checked' : ''} onchange="toggleSubtask(${index})">
            <input type="text" value="${escapeHtml(st.text)}" onchange="updateSubtaskText(${index}, this.value)">
            <button onclick="removeSubtask(${index})">×</button>
        </div>
    `).join('');
}

function addSubtaskField() { modalSubtasks.push({ text: '', done: false }); renderModalSubtasks(); }
function updateSubtaskText(index, text) { modalSubtasks[index].text = text; }
function toggleSubtask(index) { modalSubtasks[index].done = !modalSubtasks[index].done; }
function removeSubtask(index) { modalSubtasks.splice(index, 1); renderModalSubtasks(); }

async function saveTask() {
  const id = document.getElementById('task-id').value;
  const title = document.getElementById('task-title').value.trim();
  const description = document.getElementById('task-desc').value.trim();
  const status = document.getElementById('task-status').value;
  const priority = document.getElementById('task-priority').value;
  const due_date = document.getElementById('task-due-date').value || null;

  if (!title) { showToast('Введите название задачи', true); return; }

  const cleanSubtasks = modalSubtasks.filter(st => st.text.trim() !== '');
  const taskData = { user_email: currentUser.email, title, description, status, priority, due_date, subtasks: cleanSubtasks };

  try {
    if (id) {
        const { error } = await window.SB.from('tasks').update(taskData).eq('id', id);
        if (error) throw error;
        showToast('Задача обновлена');
    } else {
        const { error } = await window.SB.from('tasks').insert(taskData);
        if (error) throw error;
        showToast('Задача создана');
    }
    closeModal();
    loadTasks();
  } catch (e) {
    showToast('Ошибка сохранения: ' + e.message, true);
  }
}

function escapeHtml(text) {
  if (!text) return '';
  return String(text).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
}

loadTasks();
</script>
